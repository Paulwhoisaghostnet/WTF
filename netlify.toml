[build]
  command = "npm run build:netlify"
  publish = "dist/public"
  functions = "dist/functions"

[build.environment]
  NODE_VERSION = "20"
  # Do not set ESBUILD_BINARY_PATH — Netlify’s function bundler ships esbuild 0.27.x; pointing at
  # node_modules/esbuild (different patch) causes "Host version does not match binary version".
  # Install devDependencies (Vite, esbuild) even if Site env sets NODE_ENV=production
  NPM_CONFIG_PRODUCTION = "false"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg-native"]

# Proxy /api/* to the `api` function. Path must become /api/... AFTER serverless-http strips
# basePath `/.netlify/functions/api`, or Express routes (/api/auth/register, etc.) never match.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
