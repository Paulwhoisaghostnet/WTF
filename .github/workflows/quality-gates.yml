name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  app-quality:
    name: Unit / Audit / Typecheck / Build / Inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm run security:audit

      - name: Supply-chain policy
        run: npm run security:supply-chain

      - name: Public release boundary
        run: npm run security:public-release-boundary

      - name: Docker build-context boundary
        run: npm run security:docker-context

      - name: Environment inventory
        run: npm run env:inventory:check

      - name: Bug bounty board integrity
        run: npm run bounty:board:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Aggregate unit tests
        run: npm run test:unit

      - name: Generate CycloneDX SBOM
        run: npm run security:sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: wtfos-cyclonedx-sbom
          path: artifacts/sbom.cdx.json
          if-no-files-found: error

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run check

      - name: Vite env policy
        run: npm run check:vite-env

      - name: Build
        run: npm run build

      - name: Inventory registry coverage (skeleton, not feature completeness)
        run: npm run test:e2e:inventory:coverage

      - name: Inventory route smoke (reachability, not durable behavior)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Inventory Playwright smoke started at ${started_at}"

          (
            elapsed=0
            while true; do
              sleep 60
              elapsed=$((elapsed + 60))
              echo "Inventory Playwright smoke still running after ${elapsed}s"
            done
          ) &
          heartbeat_pid="$!"
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

          npx playwright test tests/playwright/inventory --reporter=line
          kill "$heartbeat_pid" 2>/dev/null || true
          echo "Inventory Playwright smoke completed"

      - name: External link safety
        run: npm run check:external-links

  contracts-v1_2:
    name: SmartPy V1.2 Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install SmartPy
        run: pip install smartpy-tezos

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Run contract tests + compile (V1.2)
        run: |
          bash scripts/test-marketplace-contract.sh
          bash scripts/test-wtf-buyback-contract.sh
          npm run contract:macaroni-v3:compile
          git diff --exit-code -- \
            public/creation-tools/macaroni/contract/macaroni-v3.contract.json \
            public/creation-tools/macaroni/contract/macaroni-v3.storage.tz \
            public/creation-tools/macaroni/contract/macaroni-v3.template.json
