name: Update Server .env

# One-shot, dispatchable workflow that idempotently merges KEY=value lines
# into the production .env at /opt/platform/repos/wtf-app/.env, then
# restarts the `app` container so the new values are picked up.
#
# Why this exists: `.env` is git-ignored and is preserved on the server
# across deploys.  When a new env key is introduced (or an existing one
# needs to be corrected), there's no automatic path to land it in prod.
# Operators typically SSH in and edit the file by hand.  This workflow
# captures that flow so any maintainer can run it from the Actions tab,
# with auditable logs and a deterministic restart afterwards.
#
# Defaults below carry the values that need to land for W's X integration
# to find the platform gameshow account and the WTF group DM.  These are
# non-secret (handle, redirect URI, group conversation id).  Override
# `env_diff` to push other keys.  Sensitive secrets should be added via
# repository secrets and explicit secret-aware workflows, not here.
#
# Inputs:
#   env_diff   - multiline KEY=value list to merge into the server's .env.
#                Lines starting with `#` and blank lines are ignored.
#   restart    - "true" (default) restarts `app` after the merge.
#   dry_run    - "true" prints the planned changes without writing.

on:
  workflow_dispatch:
    inputs:
      env_diff:
        description: "KEY=value lines to merge into /opt/platform/repos/wtf-app/.env (one per line)."
        required: false
        type: string
        default: |
          TWITTER_OAUTH2_REDIRECT_URI=https://wtfgameshow.app/api/auth/twitter-oauth2/callback
          W_X_DEFAULT_ACCOUNT_HANDLE=wtf_gameshow
          W_X_GAMESHOW_DM_CONVERSATION_ID=g1934373363226407162
      restart:
        description: "Restart the app container after merging."
        required: false
        default: "true"
      dry_run:
        description: "Print planned changes without writing or restarting."
        required: false
        default: "false"

concurrency:
  group: hetzner-env-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<SSHCFG
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
            ConnectTimeout 30
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Stage env_diff payload
        env:
          ENV_DIFF: ${{ inputs.env_diff }}
        run: |
          printf '%s\n' "$ENV_DIFF" > /tmp/env_diff.txt
          echo "==> staged env_diff:"
          # Mask values when echoing so secrets passed via dispatch don't
          # leak into logs.  Real audit lives on the server in .env itself.
          awk -F= 'NF>=2 && $1 !~ /^[[:space:]]*#/ && $1 != "" {printf "%s=***\n", $1}' /tmp/env_diff.txt
          echo "==> total non-comment lines: $(grep -cE '^[[:space:]]*[A-Z_][A-Z0-9_]*=' /tmp/env_diff.txt || true)"

      - name: Apply env_diff on server
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RESTART: ${{ inputs.restart }}
        run: |
          # Stream the diff into a remote temp file, then run an awk-based
          # merger that rewrites /opt/platform/repos/wtf-app/.env in place.
          # `awk` is universally available on the host's busybox/debian
          # toolchain and avoids the GNU-vs-BSD `sed -i` portability trap.
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            /tmp/env_diff.txt \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/tmp/wtf_env_diff.txt"

          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            DRY_RUN="$DRY_RUN" RESTART="$RESTART" \
            bash -s <<'REMOTE'
          set -euo pipefail
          ENV_FILE=/opt/platform/repos/wtf-app/.env
          DIFF_FILE=/tmp/wtf_env_diff.txt

          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: $ENV_FILE missing on server"
            exit 1
          fi
          if [ ! -s "$DIFF_FILE" ]; then
            echo "ERROR: env diff payload empty"
            exit 1
          fi

          # Build the merged file in a tmp location.  awk reads the diff
          # into an associative array, then walks the existing .env and
          # overwrites any matching key with the new value.  Keys not
          # present in the original are appended at the end with a header
          # so it's clear what got added by this run.
          TMP=$(mktemp)
          awk -v diff="$DIFF_FILE" '
            BEGIN {
              while ((getline line < diff) > 0) {
                # skip blank and comment lines in the diff
                if (line ~ /^[[:space:]]*$/) continue
                if (line ~ /^[[:space:]]*#/) continue
                eq = index(line, "=")
                if (eq <= 1) continue
                k = substr(line, 1, eq - 1)
                v = substr(line, eq + 1)
                # validate key looks like an env var
                if (k !~ /^[A-Z_][A-Z0-9_]*$/) continue
                wanted[k] = v
                order[++n] = k
              }
              close(diff)
            }
            {
              line = $0
              # only consider non-comment KEY=... lines for replacement
              if (line ~ /^[[:space:]]*#/) { print line; next }
              eq = index(line, "=")
              if (eq <= 1) { print line; next }
              k = substr(line, 1, eq)
              # strip trailing = to compare
              gsub(/=$/, "", k)
              if (k in wanted) {
                printf "%s=%s\n", k, wanted[k]
                seen[k] = 1
                replaced++
              } else {
                print line
              }
            }
            END {
              # append keys that were not in the original file
              header_printed = 0
              for (i = 1; i <= n; i++) {
                k = order[i]
                if (!(k in seen)) {
                  if (!header_printed) {
                    printf "\n# --- appended by update-env workflow %s ---\n", strftime("%Y-%m-%dT%H:%M:%SZ", systime(), 1)
                    header_printed = 1
                  }
                  printf "%s=%s\n", k, wanted[k]
                  added++
                }
              }
              printf "\n==> replaced=%d added=%d\n", replaced+0, added+0 > "/dev/stderr"
            }
          ' "$ENV_FILE" > "$TMP"

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "==> DRY RUN: diff against current .env (keys masked):"
            diff -u <(awk -F= '{printf "%s=...\n", $1}' "$ENV_FILE") \
                    <(awk -F= '{printf "%s=...\n", $1}' "$TMP") || true
            rm -f "$TMP" "$DIFF_FILE"
            exit 0
          fi

          # Backup before writing.  Keep the last 5 timestamped backups.
          BACKUP="$ENV_FILE.bak.$(date +%Y%m%dT%H%M%S)"
          cp -p "$ENV_FILE" "$BACKUP"
          mv "$TMP" "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          ls -1t "$ENV_FILE".bak.* 2>/dev/null | tail -n +6 | xargs -r rm -f

          echo "==> updated $ENV_FILE (backup at $BACKUP)"
          echo "==> W_X_* and TWITTER_* keys now present (values masked):"
          awk -F= '/^(W_X_|TWITTER_OAUTH2_|TWITTER_CLIENT_|TWITTER_BEARER_|X_BEARER_)/{printf "  %s=%s\n", $1, ($2 == "" ? "(empty)" : "***")}' "$ENV_FILE"

          rm -f "$DIFF_FILE"

          if [ "${RESTART:-true}" = "true" ]; then
            cd /opt/platform/repos/wtf-app
            echo "==> restarting app container so new env is loaded..."
            docker compose up -d --no-deps --force-recreate app
            sleep 5
            docker compose ps app
          else
            echo "==> restart skipped (set restart=true to apply changes live)"
          fi
          REMOTE

      - name: Health check
        if: ${{ inputs.dry_run != 'true' && inputs.restart == 'true' }}
        run: |
          echo "Waiting 10s for app restart..."
          sleep 10
          for i in 1 2 3 4 5; do
            STATUS=$(ssh -i ~/.ssh/id_ed25519 \
              "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
              "curl -sf http://localhost:3000/api/health 2>/dev/null || echo FAIL")
            if echo "$STATUS" | grep -q '"status":"ok"'; then
              echo "Health check passed: $STATUS"
              exit 0
            fi
            echo "Attempt $i: $STATUS — retrying in 8s..."
            sleep 8
          done
          echo "Health check failed — fetching recent app logs:"
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "cd /opt/platform/repos/wtf-app && docker compose logs --tail=50 app"
          exit 1
