name: Deploy to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" << 'EOF'
            set -e
            cd /opt/platform/repos/wtf-app

            # Verify required secret env file exists (gitignored, must be placed manually on server)
            if [ ! -f .env ]; then
              echo "ERROR: /opt/platform/repos/wtf-app/.env is missing. Create it with secrets before deploying."
              exit 1
            fi

            git fetch origin
            git reset --hard origin/main
            docker compose up -d --build
            # Apply Drizzle schema to Postgres (creates missing tables, e.g. wallet_auth_nonces)
            docker compose exec -T app npx --yes drizzle-kit@0.31.10 push
            docker compose restart app
            docker image prune -f
          EOF

      - name: Health check
        run: |
          echo "Waiting 60s for Docker build and startup..."
          sleep 60
          for i in 1 2 3 4 5 6; do
            STATUS=$(ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
              "curl -sf http://localhost:3000/api/health 2>/dev/null || echo FAIL")
            if echo "$STATUS" | grep -qE '"status":"ok"|"ok":true'; then
              echo "Health check passed: $STATUS"
              exit 0
            fi
            echo "Attempt $i: $STATUS — retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after 6 attempts — dumping container logs:"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "cd /opt/platform/repos/wtf-app && docker compose logs --tail=50 app"
          exit 1
