name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hetzner-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts
          # Long deploys (full Docker rebuilds + serial SQL migrations) were
          # dying mid-run with "Connection to *** closed by remote host.".
          # Pin per-user SSH client defaults so every ssh invocation in this
          # job gets keepalives and is tolerant to brief network blips.
          cat > ~/.ssh/config <<SSHCFG
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
            ConnectTimeout 30
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" << 'EOF'
            set -e
            cd /opt/platform/repos/wtf-app

            if [ ! -f .env ]; then
              echo "ERROR: .env is missing. Create it before deploying."
              exit 1
            fi

            git fetch origin
            git reset --hard origin/main

            COMMIT_SHA=$(git rev-parse --short HEAD)
            export COMMIT_SHA

            # ── Kill any rogue standalone caddy containers ──────────────
            for cid in $(docker ps -aq --filter "name=^caddy$" 2>/dev/null); do
              NAME=$(docker inspect --format '{{.Name}}' "$cid" 2>/dev/null || true)
              if [ "$NAME" != "/wtf-app-caddy-1" ]; then
                echo "Removing rogue caddy container: $cid ($NAME)"
                docker stop "$cid" 2>/dev/null || true
                docker rm -f "$cid" 2>/dev/null || true
              fi
            done

            # ── Build and deploy ────────────────────────────────────────
            # Source non-secret VITE_* contract addresses from the host
            # .env so Vite bakes them into the SPA bundle.  Without
            # this the builder runs `npm run build` with empty
            # contract addresses (.env is excluded by .dockerignore)
            # and the production marketplace appears disconnected from
            # the deployed contracts.  These KT1 addresses are public
            # on-chain identifiers, not secrets.  See
            # WTF_APP_STRUCTURE_MAP.md section 2 (build context
            # warning) and section 10 (Plan D).
            set -a
            . ./.env
            set +a

            docker compose build --no-cache \
              --build-arg COMMIT_SHA="$COMMIT_SHA" \
              --build-arg VITE_MARKETPLACE_CONTRACT_ADDRESS="${VITE_MARKETPLACE_CONTRACT_ADDRESS:-}" \
              --build-arg VITE_BARTER_CONTRACT_ADDRESS="${VITE_BARTER_CONTRACT_ADDRESS:-}" \
              app
            docker compose down --remove-orphans
            sleep 2

            # Retry `up -d` to absorb the occasional Docker "No such
            # container" race after a full teardown. We retry up to 3
            # times, cleaning up between attempts.
            up_attempts=0
            until docker compose up -d --remove-orphans; do
              up_attempts=$((up_attempts + 1))
              if [ "$up_attempts" -ge 3 ]; then
                echo "docker compose up -d failed after $up_attempts attempts"
                docker compose ps || true
                docker compose logs --tail=60 || true
                exit 1
              fi
              echo "compose up failed (attempt $up_attempts); cleaning up and retrying in 5s..."
              docker compose down --remove-orphans || true
              sleep 5
            done

            echo "Waiting 10s for app to start..."
            sleep 10

            # ── Apply cockpit backfill SQL BEFORE drizzle-kit push ──────
            # drizzle-kit push --force will drop user_owned_tokens because
            # it was removed from the schema in Phase 6.  cockpit_all.sql
            # is fully idempotent and does the backfill + table creation
            # first so no data is lost, then drops the legacy table itself
            # (after which drizzle-kit push is a no-op for that branch).
            if [ -f drizzle/cockpit_all.sql ]; then
              echo "Applying drizzle/cockpit_all.sql to the postgres container..."
              docker compose exec -T postgres psql -U wtf -d wtf \
                -v ON_ERROR_STOP=1 < drizzle/cockpit_all.sql
            else
              echo "WARN: drizzle/cockpit_all.sql missing — skipping cockpit backfill"
            fi

            # ── Apply post-cockpit numbered migrations (0015+) ──────────
            # drizzle-kit push historically fails to add new tables on
            # our production DB (observed: backfill_manifest from 0017
            # never appeared after a clean push, then system_event_logs
            # from 0036 — same failure mode, different migration).
            # Apply every numbered SQL file from 0015 upward in lexical
            # order so additive changes always land regardless of what
            # push decides to do.  Every file in 0015+ is written to be
            # idempotent (CREATE / ALTER … IF NOT EXISTS, WHERE guards
            # on UPDATE/DELETE, DO $$ … duplicate_object handlers).
            echo "Applying post-cockpit migrations (0015+) in order..."
            for sql in $(ls drizzle/0[0-9][0-9][0-9]_*.sql 2>/dev/null | sort); do
              [ -f "$sql" ] || continue
              base=$(basename "$sql")
              # Skip anything below 0015 — those are pre-cockpit and
              # already covered by cockpit_all.sql above.
              prefix=${base%%_*}
              if [ "$prefix" \< "0015" ]; then
                continue
              fi
              echo "  → applying $base"
              if ! docker compose exec -T postgres psql -U wtf -d wtf \
                   -v ON_ERROR_STOP=1 < "$sql"; then
                echo "    (migration $base failed — continuing; idempotent files should survive duplicate apply)"
              fi
            done

            # ── Apply DB migrations ─────────────────────────────────────
            docker compose exec -T app npx drizzle-kit push --force
            docker compose restart app
            sleep 5

            docker image prune -f
          EOF

      - name: Health check
        run: |
          echo "Waiting 15s for app restart..."
          sleep 15
          for i in 1 2 3 4 5; do
            STATUS=$(ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
              "curl -sf http://localhost:3000/api/health 2>/dev/null || echo FAIL")
            if echo "$STATUS" | grep -q '"status":"ok"'; then
              echo "Health check passed: $STATUS"
              exit 0
            fi
            echo "Attempt $i: $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed — dumping container logs:"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "cd /opt/platform/repos/wtf-app && docker compose logs --tail=40 app"
          exit 1
