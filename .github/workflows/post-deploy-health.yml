name: Post-Deploy Health

# Dispatchable read-only health snapshot.  Confirms the app is up,
# summarises recent /api/gallery/mine traffic, and surfaces wallet
# linkage gaps (e.g. users with 0 holdings).  Safe to run any time.

on:
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Container status
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose ps'

      - name: Gallery endpoint probe (via localhost inside the app container)
        # Server listens on :3000 (see server/index.ts + docker-compose.yml).
        # Unauthenticated — we just want to confirm the route returns JSON
        # and not a 500 from the old SQL bug.  401 is a healthy signal.
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose exec -T app node -e "
              (async () => {
                const r = await fetch(\"http://127.0.0.1:3000/api/gallery/mine?limit=1\", {
                  headers: { accept: \"application/json\" },
                });
                console.log(\"status:\", r.status);
                const text = await r.text();
                console.log(\"body (first 200 chars):\", text.slice(0, 200));
                if (r.status >= 500) process.exit(1);
              })().catch((e) => { console.error(e); process.exit(1); });
            "'

      - name: Portfolio analytics endpoints probe
        # Hits the /api/portfolio/* surface added in phase 4.  Every
        # user-scoped endpoint should answer 401 for the anon fetch
        # (auth gate in place); the public token-market endpoint should
        # return 200 or 404 depending on whether a market_summary row
        # exists for the probe target.  >=500 fails the job.
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose exec -T app node -e "
              (async () => {
                const base = \"http://127.0.0.1:3000\";
                const probes = [
                  [\"summary\",          \"/api/portfolio/summary\",                           [401]],
                  [\"wallet-slice\",     \"/api/portfolio/summary/tz1fakeaddrfortesting12345\", [401]],
                  [\"activity-acq\",     \"/api/portfolio/activity/acquisitions?limit=1\",     [401]],
                  [\"activity-sales\",   \"/api/portfolio/activity/sales?limit=1\",            [401]],
                  [\"token-market\",     \"/api/portfolio/tokens/KT1RJ6PbjHpwc3M5rw5s2Nbmefwbuwbdxton/0/market\", [200, 404]],
                ];
                let anyFail = false;
                for (const [name, path, ok] of probes) {
                  try {
                    const r = await fetch(base + path);
                    const txt = (await r.text()).slice(0, 160).replace(/\\s+/g, \" \");
                    const healthy = ok.includes(r.status);
                    console.log(
                      (healthy ? \"OK\" : \"FAIL\") + \" \" + name + \" → \" + r.status + \" | \" + txt
                    );
                    if (!healthy) anyFail = true;
                  } catch (e) {
                    console.error(\"ERROR\", name, e.message);
                    anyFail = true;
                  }
                }
                if (anyFail) process.exit(1);
              })();
            "'

      - name: Portfolio SQL deep probe (real token + real user)
        # Confirms the portfolio-analytics SQL actually runs against
        # live data end-to-end — picks the highest-volume token for a
        # token-market call and the user with the most holdings for
        # a summary call.  Uses the node runtime inside the app
        # container so we reuse the real `db` pool / credentials.
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose exec -T app node -e "
              (async () => {
                const { Pool } = require(\"pg\");
                const pool = new Pool({ connectionString: process.env.DATABASE_URL });

                // Busiest token for market probe
                const { rows: tRows } = await pool.query(
                  \"SELECT token_contract, token_id, COUNT(*)::int AS sales FROM token_sales GROUP BY 1,2 ORDER BY sales DESC LIMIT 1\"
                );
                const tgt = tRows[0];
                console.log(\"busiest-token:\", tgt);

                // User with most holdings for summary probe
                const { rows: uRows } = await pool.query(
                  \"SELECT user_id, COUNT(*)::int AS tokens FROM wallet_holdings GROUP BY user_id ORDER BY tokens DESC LIMIT 1\"
                );
                const tgtUser = uRows[0];
                console.log(\"busiest-user:\", tgtUser);

                const base = \"http://127.0.0.1:3000\";

                // Public token-market probe — expect 200 with metrics
                if (tgt) {
                  const url =
                    base +
                    \"/api/portfolio/tokens/\" + encodeURIComponent(tgt.token_contract) +
                    \"/\" + encodeURIComponent(tgt.token_id) + \"/market\";
                  const r = await fetch(url);
                  const text = await r.text();
                  console.log(\"token-market status:\", r.status);
                  console.log(\"token-market body:\", text.slice(0, 400));
                  if (r.status !== 200) { console.error(\"token-market unexpected\"); process.exit(1); }
                }

                // Summary SQL deep probe — import the real helper and
                // invoke it with the busiest-user id.  Bypasses the HTTP
                // auth gate so we can actually exercise the SQL at scale.
                if (tgtUser) {
                  try {
                    const mod = await import(\"/app/dist/server/lib/portfolio-analytics.js\").catch(() => null);
                    if (mod && mod.getPortfolioSummary) {
                      const start = Date.now();
                      const s = await mod.getPortfolioSummary(tgtUser.user_id);
                      console.log(\"summary-sql wallets:\", s.totals.wallets, \"tokens:\", s.totals.tokensHeld, \"costMutez:\", s.totals.costBasisMutez, \"elapsed_ms:\", Date.now() - start);
                    } else {
                      console.log(\"summary-sql: bundled helper not found at /app/dist — skipping deep probe (HTTP-level OK)\");
                    }
                  } catch (e) {
                    console.error(\"summary-sql error:\", e && e.stack ? e.stack : e);
                    process.exit(1);
                  }
                }

                await pool.end();
              })().catch((e) => { console.error(e); process.exit(1); });
            "'

      - name: Recent gallery traffic (last 15 min)
        run: |
          echo "=== gallery log lines (last 15 min) ==="
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose logs --since 15m app 2>&1' \
            | grep -iE "api/gallery|\[gallery\]" \
            | tail -60 \
            || echo "(no matches)"

      - name: User / wallet / holdings linkage map
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose exec -T postgres psql -U wtf -d wtf -v ON_ERROR_STOP=1' <<'SQL'
          \pset format aligned
          \pset pager off

          SELECT u.id             AS user_id,
                 u.username,
                 count(DISTINCT w.id)::int AS wallets_linked,
                 count(h.*)::int           AS holdings,
                 max(h.derived_at)         AS last_derive
            FROM users u
            LEFT JOIN user_wallets w     ON w.user_id = u.id
            LEFT JOIN wallet_holdings h  ON h.user_id = u.id
           GROUP BY u.id, u.username
           ORDER BY u.id;
          SQL
