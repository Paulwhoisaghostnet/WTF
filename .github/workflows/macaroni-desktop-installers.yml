name: Macaroni Desktop Installers

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach installers to a GitHub release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag to publish, for example macaroni-desktop-v1.0.1-alpha.1"
        required: false
        type: string
  push:
    tags:
      - "macaroni-desktop-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal
            os: macos-latest
            command: npm run dist:mac --prefix apps/macaroni-desktop
            artifact: macaroni-desktop-macos
          - label: Windows x64
            os: windows-latest
            command: npm run dist:windows --prefix apps/macaroni-desktop
            artifact: macaroni-desktop-windows
          - label: Raspberry Pi arm64
            os: ubuntu-24.04-arm
            command: npm run dist:raspberry-pi --prefix apps/macaroni-desktop
            artifact: macaroni-desktop-raspberry-pi

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/macaroni-desktop/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci --prefix apps/macaroni-desktop

      - name: Verify desktop packaging policy
        run: npm run macaroni:desktop:check

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Install and smoke packaged macOS artifacts
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/macaroni-desktop/package.json').version")
          bash scripts/pasta-desktop-macos-artifact-smoke.sh \
            "macaroni" \
            "apps/macaroni-desktop/release/Macaroni-Studio-${VERSION}-mac-universal.dmg" \
            "apps/macaroni-desktop/release/Macaroni-Studio-${VERSION}-mac-universal.zip" \
            "macaroni-studio.app" \
            "macaroni-studio"

      - name: Install and smoke packaged Windows application
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = node -p "require('./apps/macaroni-desktop/package.json').version"
          $installer = Join-Path "${{ github.workspace }}" "apps\macaroni-desktop\release\Macaroni-Studio-$version-win-x64.exe"
          & ".\scripts\pasta-desktop-windows-installer-smoke.ps1" `
            -AppKey "macaroni" `
            -InstallerPath $installer `
            -ExecutableName "macaroni-studio.exe" `
            -ShortcutName "Macaroni Studio"

      - name: Install and smoke packaged Raspberry Pi application
        if: matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/macaroni-desktop/package.json').version")
          bash scripts/pasta-desktop-linux-installer-smoke.sh \
            "macaroni" \
            "apps/macaroni-desktop/release/Macaroni-Studio-${VERSION}-linux-arm64.deb" \
            "macaroni-studio" \
            "macaroni-studio"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/macaroni-desktop/release/*.dmg
            apps/macaroni-desktop/release/*.zip
            apps/macaroni-desktop/release/*.exe
            apps/macaroni-desktop/release/*.deb
            apps/macaroni-desktop/release/*.blockmap
            apps/macaroni-desktop/release/latest*.yml
          if-no-files-found: error

  release:
    name: Publish installer release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/macaroni-desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5

      - name: Validate release tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/macaroni-desktop/package.json').version")
          EXPECTED_TAG="macaroni-desktop-v${VERSION}"
          ACTUAL_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          if [ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]; then
            echo "release tag must match package version: expected $EXPECTED_TAG, got ${ACTUAL_TAG:-empty}"
            exit 1
          fi
          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${ACTUAL_TAG}^{}" | awk 'NR == 1 { print $1 }')"
          if [ -z "$REMOTE_SHA" ]; then
            REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${ACTUAL_TAG}" | awk 'NR == 1 { print $1 }')"
          fi
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "existing release tag must identify the workflow source: expected $GITHUB_SHA, got $REMOTE_SHA"
            exit 1
          fi

      - name: Download installer artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find release-artifacts -maxdepth 3 -type f -print -exec cp {} release/ \;
          ls -lah release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Macaroni Desktop ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: release/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name, '-alpha.') || contains(github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name, '-beta.') || contains(github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name, '-rc.') }}
