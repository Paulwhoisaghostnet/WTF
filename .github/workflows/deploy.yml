name: Deploy to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" << 'EOF'
            set -e
            cd /opt/platform/repos/wtf-app

            if [ ! -f .env ]; then
              echo "ERROR: .env is missing. Create it before deploying."
              exit 1
            fi

            git fetch origin
            git reset --hard origin/main

            COMMIT_SHA=$(git rev-parse --short HEAD)
            export COMMIT_SHA

            echo "=== Building app image (no cache) ==="
            docker compose build --no-cache --build-arg COMMIT_SHA="$COMMIT_SHA" app

            echo "=== Stopping old containers ==="
            docker compose down

            echo "=== Starting fresh containers ==="
            docker compose up -d

            echo "=== Container status ==="
            docker compose ps

            echo "Waiting 10s for app container to be ready..."
            sleep 10

            echo "=== Verifying bundle inside container ==="
            docker compose exec -T app sh -c 'head -1 /app/dist/public/index.html && ls /app/dist/public/assets/index-*.js 2>/dev/null'

            echo "=== Applying Drizzle schema ==="
            docker compose exec -T app npx drizzle-kit push --force

            docker compose restart app
            sleep 5

            echo "=== Health check from inside server ==="
            docker compose exec -T app curl -sf http://localhost:3000/api/health || true

            echo "=== Port 3000 listeners ==="
            ss -tlnp | grep 3000 || true

            docker image prune -f
          EOF

      - name: Health check
        run: |
          echo "Waiting 30s for app restart..."
          sleep 30
          for i in 1 2 3 4 5 6; do
            STATUS=$(ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
              "curl -sf http://localhost:3000/api/health 2>/dev/null || echo FAIL")
            if echo "$STATUS" | grep -qE '"status":"ok"|"ok":true'; then
              echo "Health check passed: $STATUS"
              exit 0
            fi
            echo "Attempt $i: $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 6 attempts — dumping container logs:"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "cd /opt/platform/repos/wtf-app && docker compose logs --tail=80 app"
          exit 1
