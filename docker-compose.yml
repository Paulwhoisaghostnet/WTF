services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wtf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wtf
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Docker's default `/dev/shm` is only 64 MB, which Postgres exhausts
    # the moment a parallel query plans its dynamic shared memory
    # segments.  That manifested as the gallery 500'ing for users with
    # ~7k+ holdings (the facet queries trigger parallel workers on
    # large LEFT JOINs over token_metadata).  1 GB is plenty for this
    # workload; raise only if SELECT pg_shmem_allocations() ever
    # approaches it.
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtf -d wtf"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        COMMIT_SHA: ${COMMIT_SHA:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://wtf:${POSTGRES_PASSWORD}@postgres:5432/wtf
      NODE_ENV: production
      COMMIT_REF: ${COMMIT_SHA:-dev}
    volumes:
      - uploads:/app/uploads
      - cache:/app/cache
      - backups:/app/backups
      - app_logs:/app/logs
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Allow Caddy to reach native host services (e.g. kiln.service on :3001)
    # via `host.docker.internal`. Linux does not populate this by default; the
    # `host-gateway` alias was added in Docker 20.10+.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 1.1.1.1
      - 8.8.8.8

volumes:
  pgdata:
  uploads:
  cache:
  backups:
  app_logs:
  caddy_data:
  caddy_config:
