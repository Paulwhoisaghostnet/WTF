name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  app-quality:
    name: Typecheck / Build / Link Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Vite env policy
        run: npm run check:vite-env

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Inventory coverage
        run: npm run test:e2e:inventory:coverage

      - name: Inventory Playwright smoke
        timeout-minutes: 30
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Inventory Playwright smoke started at ${started_at}"

          (
            elapsed=0
            while true; do
              sleep 60
              elapsed=$((elapsed + 60))
              echo "Inventory Playwright smoke still running after ${elapsed}s"
            done
          ) &
          heartbeat_pid="$!"
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

          npx playwright test tests/playwright/inventory --reporter=line
          kill "$heartbeat_pid" 2>/dev/null || true
          echo "Inventory Playwright smoke completed"

      - name: External link safety
        run: npm run check:external-links

  contracts-v1_2:
    name: SmartPy V1.2 Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install SmartPy
        run: pip install smartpy-tezos

      - name: Run contract tests + compile (V1.2)
        run: bash scripts/test-marketplace-contract.sh
