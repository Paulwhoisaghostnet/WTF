name: Install Kiln deploy key on Hetzner

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: "Full ssh-ed25519 line"
        required: true
        type: string

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH with WTF deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Report remote username and key status
        env:
          PUBKEY: ${{ inputs.public_key }}
          TARGET: ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$TARGET" bash -lc 'echo "REMOTE_USER=$(whoami)"; echo "HOME=$HOME"; echo "SUDOERS_TEST=$(sudo -n true 2>&1 | head -c 40)"; if grep -qxF "'"$PUBKEY"'" ~/.ssh/authorized_keys; then echo KEY_PRESENT=1; else echo KEY_PRESENT=0; fi; echo "AUTHORIZED_KEYS_LINES=$(wc -l < ~/.ssh/authorized_keys)"'
