name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hetzner-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_COMMIT: ${{ github.sha }}
      DEPLOY_BUNDLE: /tmp/wtf-app-${{ github.run_id }}-${{ github.run_attempt }}.bundle
      SIGNER_PACKAGE: /tmp/wtf-signer-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use the signer runtime's Node version
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts
          # Long deploys (full Docker rebuilds + serial SQL migrations) were
          # dying mid-run with "Connection to *** closed by remote host.".
          # Pin per-user SSH client defaults so every ssh invocation in this
          # job gets keepalives and is tolerant to brief network blips.
          cat > ~/.ssh/config <<SSHCFG
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
            ConnectTimeout 30
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Check for open coLILseum rooms before deploying
        id: room-preflight
        run: |
          result=0
          tar -cf - scripts/wtfiap/check-wtfos-room-deploy.sh scripts/wtfiap/assert-room-deploy-safe.cjs | \
            ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" '
              set -eu
              stage="$(mktemp -d)"
              trap '\''rm -rf -- "$stage"'\'' EXIT
              tar -xf - -C "$stage"
              bash "$stage/scripts/wtfiap/check-wtfos-room-deploy.sh"
            ' || result=$?
          if [ "$result" -eq 75 ]; then
            echo "Deployment deferred. coLILseum has open rooms or unresolved escrow." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Package exact source commit
        if: steps.room-preflight.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          LOCAL_BUNDLE="${RUNNER_TEMP}/wtf-app.bundle"
          SERVER_HEAD=$(ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "git -C /opt/platform/repos/wtf-app rev-parse HEAD")

          if [ "$(git rev-parse HEAD)" != "$DEPLOY_COMMIT" ]; then
            echo "ERROR: checked-out commit does not match requested deploy commit"
            exit 1
          fi

          if [ "$SERVER_HEAD" = "$DEPLOY_COMMIT" ]; then
            # An environment-only redeploy still needs a nonempty bundle for
            # the normal server fetch and health-check path.
            git bundle create "$LOCAL_BUNDLE" HEAD^..HEAD
          elif git cat-file -e "${SERVER_HEAD}^{commit}" 2>/dev/null && \
             git merge-base --is-ancestor "$SERVER_HEAD" "$DEPLOY_COMMIT"; then
            git bundle create "$LOCAL_BUNDLE" HEAD "^${SERVER_HEAD}"
          else
            echo "Server HEAD is not an ancestor of the requested commit; packaging a self-contained bundle"
            git bundle create "$LOCAL_BUNDLE" HEAD
          fi
          git bundle verify "$LOCAL_BUNDLE"
          scp -i ~/.ssh/id_ed25519 "$LOCAL_BUNDLE" \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:${DEPLOY_BUNDLE}"

      - name: Package operator signer
        if: steps.room-preflight.outputs.eligible == 'true'
        run: |
          LOCAL_SIGNER_PACKAGE="${RUNNER_TEMP}/wtf-operator-signer.tar.gz"
          bash extensions/wtf-operator-signer/deploy/server-deploy.sh --package "$LOCAL_SIGNER_PACKAGE"
          SIGNER_SHA="$(sha256sum "$LOCAL_SIGNER_PACKAGE" | cut -d' ' -f1)"
          echo "SIGNER_SHA=$SIGNER_SHA" >> "$GITHUB_ENV"
          scp -i ~/.ssh/id_ed25519 "$LOCAL_SIGNER_PACKAGE" \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:${SIGNER_PACKAGE}"

      - name: Deploy on server
        id: server-deploy
        if: steps.room-preflight.outputs.eligible == 'true'
        run: |
          result=0
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "DEPLOY_COMMIT='$DEPLOY_COMMIT' DEPLOY_BUNDLE='$DEPLOY_BUNDLE' SIGNER_PACKAGE='$SIGNER_PACKAGE' SIGNER_SHA='$SIGNER_SHA' bash -s" << 'EOF' || result=$?
            set -euo pipefail
            stage="$(mktemp -d)"
            cleanup() {
              rm -f "$DEPLOY_BUNDLE" "$SIGNER_PACKAGE"
              rm -rf -- "$stage"
            }
            trap cleanup EXIT
            exec 9<>/tmp/wtf-app-deploy.lock
            flock 9
            cd /opt/platform/repos/wtf-app

            if [ ! -f .env ]; then
              echo "ERROR: .env is missing. Create it before deploying."
              exit 1
            fi

            git fetch "$DEPLOY_BUNDLE" HEAD
            BUNDLED_COMMIT=$(git rev-parse FETCH_HEAD)
            if [ "$BUNDLED_COMMIT" != "$DEPLOY_COMMIT" ]; then
              echo "ERROR: transferred bundle resolved to $BUNDLED_COMMIT instead of $DEPLOY_COMMIT"
              exit 1
            fi
            git archive "$BUNDLED_COMMIT" \
              extensions/wtf-operator-signer/deploy/server-deploy.sh \
              scripts/wtfiap/check-wtfos-room-deploy.sh \
              scripts/wtfiap/assert-room-deploy-safe.cjs \
              scripts/wtfiap/fence-deploy-ingress.cjs \
              scripts/wtfiap/with-deploy-ingress-fence.sh | tar -xf - -C "$stage"

            install -m 0600 "$SIGNER_PACKAGE" "$stage/signer.tar.gz"
            printf '%s  %s\n' "$SIGNER_SHA" "$stage/signer.tar.gz" | sha256sum --check --status
            export BUNDLED_COMMIT stage
            bash "$stage/scripts/wtfiap/with-deploy-ingress-fence.sh" -- bash -s <<'REPLACE'
            set -euo pipefail
            bash "$stage/extensions/wtf-operator-signer/deploy/server-deploy.sh" --install-package "$stage/signer.tar.gz"
            git reset --hard
            git checkout -B main "$BUNDLED_COMMIT"
            git reset --hard "$BUNDLED_COMMIT"
            bash scripts/server-deploy.sh
          REPLACE
          EOF
          if [ "$result" -eq 75 ]; then
            echo "Deployment deferred. coLILseum received an open room before replacement." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          echo "replaced=true" >> "$GITHUB_OUTPUT"

      - name: Health check
        if: steps.server-deploy.outputs.replaced == 'true'
        run: |
          echo "Waiting 15s for app restart..."
          sleep 15
          EXPECTED_COMMIT="${DEPLOY_COMMIT:0:8}"
          for i in 1 2 3 4 5; do
            STATUS=$(ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
              "curl -sf http://localhost:3000/api/health/ready 2>/dev/null || echo FAIL")
            if echo "$STATUS" | grep -q '"status":"ready"' && \
               echo "$STATUS" | grep -q "\"commitRef\":\"$EXPECTED_COMMIT\""; then
              echo "Health check passed: $STATUS"
              exit 0
            fi
            echo "Attempt $i: $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed — dumping container logs:"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "cd /opt/platform/repos/wtf-app && docker compose logs --tail=40 app"
          exit 1
