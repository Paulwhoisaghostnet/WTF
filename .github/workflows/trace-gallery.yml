name: Trace Gallery

# Read-only authenticated trace.  Grabs raw app logs, checks auth, and
# reports user session shape.  Run this AFTER refreshing the gallery
# in the browser so we can correlate the requests.

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "user_id to simulate (default 3 = paulwhoisaghost)"
        required: false
        default: "3"

jobs:
  trace:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Raw app logs (last 10 min, last 80 lines)
        run: |
          echo "=== raw app container logs, last 10 min (tail 80) ==="
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose logs --since 10m --tail 200 app 2>&1' \
            | tail -200

      - name: Raw caddy logs (last 10 min) — sees requests before app
        run: |
          echo "=== raw caddy logs, last 10 min (tail 120) ==="
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose logs --since 10m --tail 200 caddy 2>&1' \
            | grep -iE "gallery|api/|status|error" \
            | tail -120 \
            || echo "(no caddy traffic)"

      - name: Session table — who has live sessions
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose exec -T postgres psql -U wtf -d wtf -v ON_ERROR_STOP=1' <<'SQL'
          \pset format aligned
          \pset pager off

          SELECT sid,
                 (sess::jsonb) -> 'passport' -> 'user' AS passport_user,
                 expire
            FROM session
           WHERE expire > NOW()
           ORDER BY expire DESC
           LIMIT 10;
          SQL
