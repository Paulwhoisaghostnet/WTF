name: DB Diagnostic

# Dispatchable one-shot database diagnostics for the analytics
# platform.  Runs focused psql queries via heredoc so we avoid the
# multi-layer JS escaping that bit us on the earlier spot-check
# workflow.  Each query writes a labelled section so
# `gh run view --log` reads like a report.

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Focus area: 'unknown-cost', 'backfill', 'pipeline', or 'all'"
        required: false
        default: "all"
      user_id:
        description: "User id to audit (default 3 = paulwhoisaghost)"
        required: false
        default: "3"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Run diagnostic SQL
        env:
          FOCUS: ${{ inputs.focus }}
          USER_ID: ${{ inputs.user_id }}
        run: |
          USER_ID="${USER_ID:-3}"

          # Write the diagnostic SQL to a file so we ship it to the
          # server via scp and feed it to psql via stdin redirection
          # inside the postgres container.  Psql treats `--` as the
          # SQL comment marker, so we use that instead of `\echo --`
          # for section dividers.  Avoids the apostrophe pitfalls in
          # psql meta-commands.
          cat > /tmp/diag.sql <<SQL
          \pset format aligned
          \pset pager off

          -- ====================================================
          -- User id:    ${USER_ID}
          -- Wallet(s):
          -- ====================================================
          SELECT wallet_address, tez_domain, linked_at
            FROM user_wallets
           WHERE user_id = ${USER_ID}
           ORDER BY wallet_address;

          -- Holdings summary
          SELECT wallet_address,
                 COUNT(*)::int AS tokens,
                 COUNT(DISTINCT token_contract)::int AS contracts,
                 SUM(CASE WHEN balance = '0' OR balance = '' OR balance IS NULL THEN 1 ELSE 0 END)::int AS zero_balance
            FROM wallet_holdings
           WHERE user_id = ${USER_ID}
           GROUP BY wallet_address
           ORDER BY tokens DESC;

          -- ====================================================
          -- UNKNOWN-COST DIAGNOSIS
          -- ====================================================

          -- Step 1: rebuild the CTE unknown-acquisition set for this user.
          -- Mirrors portfolio-analytics.ts exactly: 3 cost sources
          -- (sale, mint, wallet_event), case-insensitive joins, and
          -- "unknown" only when every source is dry.
          CREATE TEMP TABLE _unknown AS
          WITH uw AS (SELECT LOWER(wallet_address) AS lwa FROM user_wallets WHERE user_id = ${USER_ID}),
          held AS (
            SELECT h.wallet_address, h.token_contract, h.token_id
              FROM wallet_holdings h
             WHERE h.user_id = ${USER_ID}
          ),
          lb AS (
            SELECT DISTINCT LOWER(s.buyer_address) AS lba,
                   s.token_contract, s.token_id
              FROM token_sales s
              JOIN uw ON uw.lwa = LOWER(s.buyer_address)
          ),
          mn AS (
            SELECT DISTINCT LOWER(m.first_owner) AS lfo,
                   m.token_contract, m.token_id
              FROM token_mint_events m
              JOIN uw ON uw.lwa = LOWER(m.first_owner)
          ),
          ev AS (
            SELECT DISTINCT LOWER(e.wallet_address) AS lwa,
                   e.token_contract, e.token_id
              FROM wallet_events e
              JOIN uw ON uw.lwa = LOWER(e.wallet_address)
             WHERE e.event_type IN ('token_mint', 'token_transfer_in')
          )
          SELECT h.wallet_address, h.token_contract, h.token_id
            FROM held h
           LEFT JOIN lb ON lb.lba = LOWER(h.wallet_address)
                       AND lb.token_contract = h.token_contract
                       AND lb.token_id = h.token_id
           LEFT JOIN mn ON mn.lfo = LOWER(h.wallet_address)
                       AND mn.token_contract = h.token_contract
                       AND mn.token_id = h.token_id
           LEFT JOIN ev ON ev.lwa = LOWER(h.wallet_address)
                       AND ev.token_contract = h.token_contract
                       AND ev.token_id = h.token_id
           WHERE lb.lba IS NULL
             AND mn.lfo IS NULL
             AND ev.lwa IS NULL;

          SELECT COUNT(*)::int AS unknown_total FROM _unknown;

          -- Step 1b: same query but with the PRE-FIX logic (sale+mint only)
          -- so we can see the delta the CTE change produced.
          SELECT COUNT(*)::int AS unknown_before_fix
            FROM wallet_holdings h
            WHERE h.user_id = ${USER_ID}
              AND NOT EXISTS (
                SELECT 1 FROM token_sales s
                 WHERE s.buyer_address = h.wallet_address
                   AND s.token_contract = h.token_contract
                   AND s.token_id = h.token_id
              )
              AND NOT EXISTS (
                SELECT 1 FROM token_mint_events m
                 WHERE m.first_owner = h.wallet_address
                   AND m.token_contract = h.token_contract
                   AND m.token_id = h.token_id
              );

          -- Step 2: profile the unknown set against ALL sales / mints
          --         for the same (contract, token_id).
          SELECT
            COUNT(*) FILTER (WHERE EXISTS (
              SELECT 1 FROM token_sales s
               WHERE s.token_contract = u.token_contract AND s.token_id = u.token_id
            ))::int AS has_any_sale,
            COUNT(*) FILTER (WHERE EXISTS (
              SELECT 1 FROM token_mint_events m
               WHERE m.token_contract = u.token_contract AND m.token_id = u.token_id
            ))::int AS has_any_mint,
            COUNT(*) FILTER (WHERE NOT EXISTS (
              SELECT 1 FROM token_sales s
               WHERE s.token_contract = u.token_contract AND s.token_id = u.token_id
            ) AND NOT EXISTS (
              SELECT 1 FROM token_mint_events m
               WHERE m.token_contract = u.token_contract AND m.token_id = u.token_id
            ))::int AS no_data_at_all
          FROM _unknown u;

          -- Step 3: was our wallet ever the SELLER of one of these?
          SELECT COUNT(*)::int AS wallet_was_seller
            FROM _unknown u
            JOIN token_sales s
              ON s.seller_address = u.wallet_address
             AND s.token_contract = u.token_contract
             AND s.token_id     = u.token_id;

          -- Step 4: case-mismatch check (should be 0; non-zero = ingest bug).
          SELECT COUNT(*)::int AS case_mismatched_sales
            FROM _unknown u
            JOIN token_sales s
              ON LOWER(s.buyer_address) = LOWER(u.wallet_address)
             AND s.buyer_address != u.wallet_address
             AND s.token_contract = u.token_contract
             AND s.token_id     = u.token_id;

          -- Step 4b: breakdown of those 99 case-mismatched rows by source.
          SELECT s.source, COUNT(*)::int AS n
            FROM _unknown u
            JOIN token_sales s
              ON LOWER(s.buyer_address) = LOWER(u.wallet_address)
             AND s.buyer_address != u.wallet_address
             AND s.token_contract = u.token_contract
             AND s.token_id     = u.token_id
           GROUP BY s.source
           ORDER BY n DESC;

          -- Step 5: wallet_events coverage for the unknown set.
          SELECT
            COUNT(*) FILTER (WHERE EXISTS (
              SELECT 1 FROM wallet_events e
               WHERE e.wallet_address = u.wallet_address
                 AND e.token_contract = u.token_contract
                 AND e.token_id     = u.token_id
                 AND e.event_type = 'token_mint'
            ))::int AS has_mint_event,
            COUNT(*) FILTER (WHERE EXISTS (
              SELECT 1 FROM wallet_events e
               WHERE e.wallet_address = u.wallet_address
                 AND e.token_contract = u.token_contract
                 AND e.token_id     = u.token_id
                 AND e.event_type = 'token_transfer_in'
            ))::int AS has_transfer_in_event,
            COUNT(*) FILTER (WHERE EXISTS (
              SELECT 1 FROM wallet_events e
               WHERE e.wallet_address = u.wallet_address
                 AND e.token_contract = u.token_contract
                 AND e.token_id     = u.token_id
                 AND e.event_type IN ('token_transfer_in','token_mint')
                 AND e.xtz_amount_mutez IS NOT NULL
                 AND e.xtz_amount_mutez > 0
            ))::int AS transfer_in_with_xtz_leg
          FROM _unknown u;

          -- Step 6: 5 concrete samples across contract diversity, merged timeline.
          WITH sample AS (
            SELECT token_contract, token_id, wallet_address
              FROM _unknown
             ORDER BY random()
             LIMIT 5
          )
          SELECT
            'HOLDING' AS kind,
            s.token_contract,
            s.token_id,
            h.wallet_address,
            h.balance::text    AS amount,
            NULL::text         AS price_mutez,
            h.first_acquired_at AS t,
            NULL::text         AS op_hash,
            NULL::text         AS src
          FROM sample s
          JOIN wallet_holdings h
            ON h.user_id = ${USER_ID}
           AND h.wallet_address = s.wallet_address
           AND h.token_contract = s.token_contract
           AND h.token_id     = s.token_id
          UNION ALL
          SELECT
            'SALE',
            ts.token_contract,
            ts.token_id,
            ts.buyer_address  AS wallet_address,
            ts.editions_sold::text AS amount,
            ts.price_mutez::text   AS price_mutez,
            ts.sold_at AS t,
            ts.op_hash AS op_hash,
            ts.source  AS src
          FROM sample s
          JOIN token_sales ts ON ts.token_contract = s.token_contract AND ts.token_id = s.token_id
          UNION ALL
          SELECT
            'MINT',
            m.token_contract,
            m.token_id,
            COALESCE(m.first_owner, m.minter_address) AS wallet_address,
            m.editions::text           AS amount,
            m.mint_fee_mutez::text     AS price_mutez,
            m.minted_at                AS t,
            m.op_hash                  AS op_hash,
            m.source                   AS src
          FROM sample s
          JOIN token_mint_events m ON m.token_contract = s.token_contract AND m.token_id = s.token_id
          UNION ALL
          SELECT
            'EVENT',
            e.token_contract,
            e.token_id,
            e.wallet_address,
            e.token_amount             AS amount,
            e.xtz_amount_mutez::text   AS price_mutez,
            e.timestamp                AS t,
            e.op_hash                  AS op_hash,
            e.event_type::text         AS src
          FROM sample s
          JOIN wallet_events e
            ON e.token_contract = s.token_contract
           AND e.token_id     = s.token_id
           AND e.wallet_address = s.wallet_address
          ORDER BY token_contract, token_id, t NULLS LAST;

          DROP TABLE _unknown;

          -- ====================================================
          -- BACKFILL STATUS
          -- ====================================================
          -- Survive if the table is absent on this deploy.
          DO \$\$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_tables WHERE tablename = 'backfill_manifest') THEN
              RAISE NOTICE 'backfill_manifest table does NOT exist on this DB — migration 0017 not applied.';
            END IF;
          END \$\$;

          -- Everything below runs only if the table exists.
          SELECT EXISTS(SELECT 1 FROM pg_tables WHERE tablename = 'backfill_manifest') AS table_exists;

          -- Scheduler-side check: is the backfill-seeder job even running?
          -- sync_runs is where scheduler.ts stamps every tick, so we can
          -- tell whether the scheduler ever fired a seeder/dispatcher pass.
          SELECT job_name, status,
                 MAX(started_at) AS last_start,
                 MAX(finished_at) AS last_finish,
                 COUNT(*)::int AS ticks_total
            FROM sync_runs
           WHERE job_name LIKE 'backfill-%'
             AND started_at > NOW() - INTERVAL '30 minutes'
           GROUP BY job_name, status
           ORDER BY job_name, status;

          -- Most recent 5 backfill-seeder ticks with their outcome text.
          SELECT job_name, status, started_at, finished_at,
                 items_in, items_out,
                 SUBSTRING(error FROM 1 FOR 200) AS error_snippet
            FROM sync_runs
           WHERE job_name LIKE 'backfill-%'
           ORDER BY started_at DESC
           LIMIT 5;

          -- Most recent 5 ERROR rows specifically, for forensic detail.
          -- These capture the seeder/dispatcher crash that's keeping the
          -- manifest empty.
          SELECT job_name, started_at,
                 SUBSTRING(error FROM 1 FOR 800) AS error_full
            FROM sync_runs
           WHERE job_name LIKE 'backfill-%'
             AND status = 'error'
           ORDER BY started_at DESC
           LIMIT 5;

          -- Seeder-specific history (last 10 rows of ANY status).
          -- Tells us: did the seeder ever run post-deploy?  is it stuck
          -- in "running"?  silent-skipped because the scheduler thinks
          -- an older run is still in flight?
          SELECT job_name, status, started_at, finished_at, duration_ms,
                 items_in, items_out,
                 SUBSTRING(error FROM 1 FOR 400) AS err
            FROM sync_runs
           WHERE job_name = 'backfill-seeder'
           ORDER BY started_at DESC
           LIMIT 10;

          -- Look for any long-running (>60s) backfill tick that might
          -- be blocking subsequent scheduler ticks.
          SELECT job_name, status, started_at, finished_at, duration_ms
            FROM sync_runs
           WHERE job_name LIKE 'backfill-%'
             AND (duration_ms IS NULL OR duration_ms > 60000)
             AND started_at > NOW() - INTERVAL '1 hour'
           ORDER BY started_at DESC
           LIMIT 10;

          SELECT status, COUNT(*)::int AS n
            FROM backfill_manifest
           GROUP BY status
           ORDER BY n DESC;

          SELECT task_type,
                 COUNT(*)::int AS total,
                 COUNT(*) FILTER (WHERE status = 'pending')::int      AS pending,
                 COUNT(*) FILTER (WHERE status = 'in_progress')::int  AS in_prog,
                 COUNT(*) FILTER (WHERE status = 'completed')::int    AS completed,
                 COUNT(*) FILTER (WHERE status = 'failed')::int       AS failed,
                 COUNT(*) FILTER (WHERE status = 'skipped')::int      AS skipped
            FROM backfill_manifest
           GROUP BY task_type
           ORDER BY total DESC;

          SELECT task_type, status, COUNT(*)::int AS n,
                 MAX(last_attempt_at) AS last_attempt,
                 MAX(completed_at)    AS last_complete
            FROM backfill_manifest
           WHERE COALESCE(last_attempt_at, completed_at) > NOW() - INTERVAL '2 hours'
           GROUP BY task_type, status
           ORDER BY task_type, status;

          SELECT task_type, target, completed_at
            FROM backfill_manifest
           WHERE completed_at IS NOT NULL
           ORDER BY completed_at DESC
           LIMIT 10;

          SELECT task_type, target, last_attempt_at,
                 SUBSTRING(last_error FROM 1 FOR 160) AS err
            FROM backfill_manifest
           WHERE status = 'failed'
           ORDER BY last_attempt_at DESC NULLS LAST
           LIMIT 10;

          -- ====================================================
          -- NEW-WALLET PIPELINE
          -- ====================================================

          SELECT user_id, wallet_address, tez_domain, linked_at
            FROM user_wallets
           ORDER BY linked_at DESC
           LIMIT 10;

          WITH recent AS (
            SELECT user_id, wallet_address, linked_at
              FROM user_wallets
             ORDER BY linked_at DESC
             LIMIT 10
          )
          SELECT r.wallet_address,
                 r.linked_at,
                 (SELECT COUNT(*)::int FROM wallet_holdings  h WHERE h.wallet_address = r.wallet_address)             AS holdings,
                 (SELECT COUNT(*)::int FROM wallet_events    e WHERE e.wallet_address = r.wallet_address)             AS events,
                 (SELECT COUNT(*)::int FROM wallet_sync_cursors c WHERE c.wallet_address = r.wallet_address AND c.backfilled) AS cursor_backfilled
            FROM recent r
           ORDER BY r.linked_at DESC;

          -- wallet_sync_cursors view across the whole fleet
          SELECT COUNT(*)::int AS total_wallets,
                 COUNT(*) FILTER (WHERE backfilled)::int      AS backfilled,
                 COUNT(*) FILTER (WHERE NOT backfilled)::int  AS not_backfilled
            FROM wallet_sync_cursors;
          SQL

          scp -i ~/.ssh/id_ed25519 /tmp/diag.sql \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/tmp/diag.sql"

          # Run without ON_ERROR_STOP so a missing table in one block
          # does not skip the pipeline sections that follow.
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose exec -T postgres psql -U wtf -d wtf < /tmp/diag.sql'
