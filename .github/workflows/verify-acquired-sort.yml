name: Verify Acquired Sort

# One-shot check: how well is wallet_holdings.first_acquired_at
# populated for paulwhoisaghost (user 3)?  If it's mostly NULL we
# need to kick holdings-derive / balance-reconcile before the new
# sort feels meaningful.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: First-acquired coverage + sanity rows
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose exec -T postgres psql -U wtf -d wtf -v ON_ERROR_STOP=1' <<'SQL'
          \pset format aligned
          \pset pager off

          \echo '=== user 3 holdings coverage ==='
          SELECT
            count(*)                                           AS total,
            count(first_acquired_at)                           AS has_event_derived,
            count(tzkt_first_time)                             AS has_tzkt_first,
            count(*) FILTER (WHERE first_acquired_at IS NULL AND tzkt_first_time IS NULL)
                                                                AS only_derived_at,
            count(last_activity_at)                             AS has_last_activity
          FROM wallet_holdings
          WHERE user_id = 3;

          \echo
          \echo '=== top 5 most-recently-acquired (new sort) ==='
          SELECT
            token_contract,
            token_id,
            balance,
            COALESCE(first_acquired_at, tzkt_first_time, derived_at) AS acquired_at,
            first_acquired_at,
            tzkt_first_time,
            derived_at
          FROM wallet_holdings
          WHERE user_id = 3
          ORDER BY COALESCE(first_acquired_at, tzkt_first_time, derived_at) DESC NULLS LAST,
                   id DESC
          LIMIT 5;

          \echo
          \echo '=== bottom 5 (oldest known acquisition) ==='
          SELECT
            token_contract,
            token_id,
            COALESCE(first_acquired_at, tzkt_first_time, derived_at) AS acquired_at
          FROM wallet_holdings
          WHERE user_id = 3
          ORDER BY COALESCE(first_acquired_at, tzkt_first_time, derived_at) ASC NULLS LAST,
                   id ASC
          LIMIT 5;
          SQL
