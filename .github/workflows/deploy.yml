name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hetzner-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_COMMIT: ${{ github.sha }}
      DEPLOY_BUNDLE: /tmp/wtf-app-${{ github.run_id }}-${{ github.run_attempt }}.bundle

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts
          # Long deploys (full Docker rebuilds + serial SQL migrations) were
          # dying mid-run with "Connection to *** closed by remote host.".
          # Pin per-user SSH client defaults so every ssh invocation in this
          # job gets keepalives and is tolerant to brief network blips.
          cat > ~/.ssh/config <<SSHCFG
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
            ConnectTimeout 30
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Package exact source commit
        run: |
          set -euo pipefail
          LOCAL_BUNDLE="${RUNNER_TEMP}/wtf-app.bundle"
          SERVER_HEAD=$(ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "git -C /opt/platform/repos/wtf-app rev-parse HEAD")

          if [ "$(git rev-parse HEAD)" != "$DEPLOY_COMMIT" ]; then
            echo "ERROR: checked-out commit does not match requested deploy commit"
            exit 1
          fi

          if git cat-file -e "${SERVER_HEAD}^{commit}" 2>/dev/null && \
             git merge-base --is-ancestor "$SERVER_HEAD" "$DEPLOY_COMMIT"; then
            git bundle create "$LOCAL_BUNDLE" HEAD "^${SERVER_HEAD}"
          else
            echo "Server HEAD is not an ancestor of the requested commit; packaging a self-contained bundle"
            git bundle create "$LOCAL_BUNDLE" HEAD
          fi
          git bundle verify "$LOCAL_BUNDLE"
          scp -i ~/.ssh/id_ed25519 "$LOCAL_BUNDLE" \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:${DEPLOY_BUNDLE}"

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "DEPLOY_COMMIT='$DEPLOY_COMMIT' DEPLOY_BUNDLE='$DEPLOY_BUNDLE' bash -s" << 'EOF'
            set -euo pipefail
            cleanup_bundle() {
              rm -f "$DEPLOY_BUNDLE"
            }
            trap cleanup_bundle EXIT
            exec 9>/tmp/wtf-app-deploy.lock
            flock 9
            cd /opt/platform/repos/wtf-app

            if [ ! -f .env ]; then
              echo "ERROR: .env is missing. Create it before deploying."
              exit 1
            fi

            git fetch "$DEPLOY_BUNDLE" HEAD
            BUNDLED_COMMIT=$(git rev-parse FETCH_HEAD)
            if [ "$BUNDLED_COMMIT" != "$DEPLOY_COMMIT" ]; then
              echo "ERROR: transferred bundle resolved to $BUNDLED_COMMIT instead of $DEPLOY_COMMIT"
              exit 1
            fi
            git reset --hard
            git checkout -B main "$BUNDLED_COMMIT"
            git reset --hard "$BUNDLED_COMMIT"

            # ── Kill any rogue standalone caddy containers ──────────────
            for cid in $(docker ps -aq --filter "name=^caddy$" 2>/dev/null); do
              NAME=$(docker inspect --format '{{.Name}}' "$cid" 2>/dev/null || true)
              if [ "$NAME" != "/wtf-app-caddy-1" ]; then
                echo "Removing rogue caddy container: $cid ($NAME)"
                docker stop "$cid" 2>/dev/null || true
                docker rm -f "$cid" 2>/dev/null || true
              fi
            done

            bash scripts/server-deploy.sh
          EOF

      - name: Health check
        run: |
          echo "Waiting 15s for app restart..."
          sleep 15
          EXPECTED_COMMIT="${DEPLOY_COMMIT:0:8}"
          for i in 1 2 3 4 5; do
            STATUS=$(ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
              "curl -sf http://localhost:3000/api/health/ready 2>/dev/null || echo FAIL")
            if echo "$STATUS" | grep -q '"status":"ready"' && \
               echo "$STATUS" | grep -q "\"commitRef\":\"$EXPECTED_COMMIT\""; then
              echo "Health check passed: $STATUS"
              exit 0
            fi
            echo "Attempt $i: $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed — dumping container logs:"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "cd /opt/platform/repos/wtf-app && docker compose logs --tail=40 app"
          exit 1
