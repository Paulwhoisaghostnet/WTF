name: Run Supabase Backup

# One-shot dispatch for the off-site backup.  Normally the nightly
# scheduler fires it at boot+10min and every 24h thereafter — this
# workflow exists so we can verify changes to supabase-backup.ts
# without waiting a day.

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Trigger off-site backup inside app container
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose exec -T app node dist/run-supabase-backup.cjs'
