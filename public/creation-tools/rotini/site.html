<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pasta Protocol</title>
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow" id="appLabel">Pasta Protocol</p>
        <h1 id="title">Loading work…</h1>
        <p id="description" class="description"></p>
      </header>
      <section class="artwork" aria-label="Published artwork">
        <img id="cover" alt="" hidden />
        <div id="mediaFallback">Artwork metadata will load from Tezos and IPFS.</div>
      </section>
      <section class="facts" aria-label="On-chain status">
        <div><span>Network</span><strong id="network"></strong></div>
        <div><span>Contract</span><a id="contract" target="_blank" rel="noopener noreferrer"></a></div>
        <div><span>Token / revision</span><strong id="itemId"></strong></div>
        <div><span>Status</span><strong id="chainState">Reading chain…</strong></div>
      </section>
      <section class="action" aria-label="Collector action">
        <div>
          <h2 id="actionTitle">Collect</h2>
          <p id="actionDetail">Connect a Tezos wallet to continue.</p>
        </div>
        <label id="amountRow">Amount <input id="amount" type="number" min="1" value="1" /></label>
        <button id="connect" type="button">Connect wallet</button>
        <button id="submit" type="button" disabled>Continue</button>
        <button id="secondarySubmit" type="button" hidden>Secondary action</button>
      </section>
      <p id="status" role="status" aria-live="polite">Opening published work…</p>
      <footer>Creator-owned and self-hosted with Pasta Protocol.</footer>
    </main>
    <script src="vendor/tezos.js"></script>
    <script src="vendor/octez-connect.js"></script>
    <script src="js/octez-wallet.js"></script>
    <script src="js/common.js"></script>
    <script src="pasta.config.js"></script>
    <script src="js/site.js"></script>
  </body>
</html>
