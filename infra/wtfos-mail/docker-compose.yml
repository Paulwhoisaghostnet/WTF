# wtfOS compartment mail — self-hosted receive on the .me box, outbound via Resend smarthost.
# For existing installations, follow SECURITY-UPGRADE.md before replacing DMS 15.
services:
  mailserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wtfos-mailserver
    hostname: mail
    domainname: wtfos.me
    restart: unless-stopped
    # DMS 16's official Compose contract allows its daemons one minute to stop.
    stop_grace_period: 1m
    ports:
      - "25:25"
      - "587:587"
      - "993:993"
    volumes:
      - mail-data:/var/mail/
      - mail-state:/var/mail-state/
      - mail-logs:/var/log/mail/
      - ${MAIL_CONFIG_PATH:-./config/}:/tmp/docker-mailserver/
      - ./certs/:/etc/letsencrypt/:ro
    environment:
      - OVERRIDE_HOSTNAME=mail.wtfos.me
      - POSTMASTER_ADDRESS=postmaster@wtfos.me
      - SSL_TYPE=manual
      - SSL_CERT_PATH=/etc/letsencrypt/fullchain.pem
      - SSL_KEY_PATH=/etc/letsencrypt/privkey.pem
      - PERMIT_DOCKER=none
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=1
      - ENABLE_OPENDKIM=1
      - OPENDKIM_KEY_LENGTH=2048
      - ONE_DIR_PER_USER=1
      - RELAY_HOST=${RELAY_HOST:-}
      - RELAY_PORT=${RELAY_PORT:-587}
      - RELAY_USER=${RELAY_USER:-resend}
      - RELAY_PASSWORD=${RESEND_API_KEY:-}
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "ss -lnt | grep -q ':25 '"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mail-data:
    name: ${MAIL_DATA_VOLUME:-mail_mail-data}
  mail-state:
    name: ${MAIL_STATE_VOLUME:-mail_mail-state}
  mail-logs:
    name: ${MAIL_LOGS_VOLUME:-mail_mail-logs}
