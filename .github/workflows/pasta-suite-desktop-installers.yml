name: Pasta Suite Desktop Installers

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach installers to a GitHub release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag to publish, for example pasta-suite-desktop-v1.0.0"
        required: false
        type: string
  push:
    tags:
      - "pasta-suite-desktop-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal
            os: macos-latest
            command: npm run dist:mac --prefix apps/pasta-suite-desktop
            artifact: pasta-suite-desktop-macos
          - label: Windows x64
            os: windows-latest
            command: npm run dist:windows --prefix apps/pasta-suite-desktop
            artifact: pasta-suite-desktop-windows
          - label: Raspberry Pi arm64
            os: ubuntu-latest
            command: npm run dist:raspberry-pi --prefix apps/pasta-suite-desktop
            artifact: pasta-suite-desktop-raspberry-pi

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/pasta-suite-desktop/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci --prefix apps/pasta-suite-desktop

      - name: Verify suite packaging policy
        run: npm run pasta-suite:desktop:check

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Smoke packaged macOS application
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/pasta-suite-smoke"
          mkdir -p "$RUNNER_TEMP/pasta-suite-smoke"
          VERSION=$(node -p "require('./apps/pasta-suite-desktop/package.json').version")
          ditto -x -k "apps/pasta-suite-desktop/release/Pasta-Suite-${VERSION}-mac-universal.zip" "$RUNNER_TEMP/pasta-suite-smoke"
          PASTA_SUITE_DESKTOP_EXECUTABLE="$RUNNER_TEMP/pasta-suite-smoke/Pasta Suite.app/Contents/MacOS/Pasta Suite" npm run pasta-suite:desktop:artifact-smoke

      - name: Install and smoke packaged Windows application
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "require('./apps/pasta-suite-desktop/package.json').version"
          $installer = Join-Path "${{ github.workspace }}" "apps\pasta-suite-desktop\release\Pasta-Suite-$version-win-x64.exe"
          if (-not (Test-Path $installer)) {
            throw "Windows installer was not produced: $installer"
          }

          $before = @(Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter "Pasta Suite.exe" -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $process = Start-Process -FilePath $installer -ArgumentList "/S" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Pasta Suite installer exited with code $($process.ExitCode)"
          }

          $installed = @(Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter "Pasta Suite.exe" -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $before -notcontains $_.FullName } |
            Select-Object -First 1)
          if ($installed.Count -ne 1) {
            throw "Installed Pasta Suite executable was not found under LOCALAPPDATA\Programs"
          }

          $desktopShortcut = Join-Path ([Environment]::GetFolderPath("Desktop")) "Pasta Suite.lnk"
          $startMenuShortcut = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "Pasta Suite.lnk" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not (Test-Path $desktopShortcut)) {
            throw "Pasta Suite desktop shortcut was not created"
          }
          if (-not $startMenuShortcut) {
            throw "Pasta Suite Start menu shortcut was not created"
          }

          $env:PASTA_SUITE_DESKTOP_EXECUTABLE = $installed.FullName
          npm run pasta-suite:desktop:artifact-smoke

          $uninstaller = Get-ChildItem $installed.DirectoryName -Filter "Uninstall*.exe" -File | Select-Object -First 1
          if (-not $uninstaller) {
            throw "Pasta Suite uninstaller was not installed"
          }
          $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Pasta Suite uninstaller exited with code $($process.ExitCode)"
          }
          Start-Sleep -Seconds 2
          if (Test-Path $installed.FullName) {
            throw "Pasta Suite executable remained after uninstall"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/pasta-suite-desktop/release/*.dmg
            apps/pasta-suite-desktop/release/*.zip
            apps/pasta-suite-desktop/release/*.exe
            apps/pasta-suite-desktop/release/*.deb
            apps/pasta-suite-desktop/release/*.blockmap
            apps/pasta-suite-desktop/release/latest*.yml
            apps/pasta-suite-desktop/build/README.txt
            apps/pasta-suite-desktop/build/license_en.rtf
          if-no-files-found: error

  release:
    name: Publish installer release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/pasta-suite-desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    steps:
      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ -z "${{ inputs.release_tag }}" ]; then
            echo "release_tag is required when publish_release is true"
            exit 1
          fi

      - name: Download installer artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find release-artifacts -maxdepth 3 -type f -print -exec cp {} release/ \;
          ls -lah release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: Pasta Suite ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: release/*
          fail_on_unmatched_files: true
