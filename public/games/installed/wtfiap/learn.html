<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>coLILseum · Learn</title><style>
:root{color-scheme:dark;--gold:#e8bf71;--cream:#eee9d9}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b171a;color:var(--cream);font:14px/1.4 system-ui,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;gap:15px;padding:7px 14px;border-bottom:1px solid #47625d;background:#14282b}header strong{color:var(--gold);font-size:19px}header a{margin-left:auto;color:var(--cream);text-decoration:none}.lesson{display:flex;align-items:center;gap:14px;padding:9px 14px;border-bottom:2px solid var(--gold);background:#1d3432}.chapter{flex:1;min-width:0}.chapter small{display:block;color:var(--gold);font-weight:800;letter-spacing:.12em;text-transform:uppercase}.chapter h1{margin:0;font:22px Georgia,serif}.chapter p{margin:3px 0 0;line-height:1.35}.lesson button,.lesson a{flex:none;min-height:44px;padding:8px 15px;border:1px solid var(--gold);border-radius:5px;background:#e8bf71;color:#102123;font:700 14px system-ui;cursor:pointer;text-decoration:none}.lesson button:disabled{opacity:.45;cursor:default}.lesson button:focus-visible,.lesson a:focus-visible,header a:focus-visible{outline:3px solid #fff;outline-offset:2px}iframe{flex:1;min-height:0;width:100%;border:0}#progress{color:#b6c7bd;white-space:nowrap}@media(max-width:650px){header{padding:4px 8px}.lesson{gap:6px;padding:5px 8px}.chapter h1{font-size:17px}.chapter p{font-size:12px}.lesson button{padding:5px 8px}#progress{display:none}}
</style></head><body><header><strong>Learn coLILseum</strong><span>Play through a guided first round on the real game board.</span><a href="welcome.html">Home</a></header><section class="lesson" aria-label="Guided lesson"><div class="chapter"><small id="progress"></small><h1 id="title"></h1><p id="instruction"></p></div><button id="next" type="button"></button></section><iframe id="arena" src="generator.html?mode=match&amp;boardMode=standard&amp;seed=coLILseum-learn-v1&amp;tutorial=1" title="Interactive coLILseum tutorial game board" allow="fullscreen; orientation-lock"></iframe>
<script>
const steps=[
  {title:'Welcome to the arena',body:'You start at commander level 1 with one field slot and one gold. The shop, board, bench, and battle controls all live in this real practice match.',action:null,button:'Start lesson'},
  {title:'Inspect a shop hero',body:'Select a hero offer to preview their cost, faction, class, ability, and three stat bars. On a phone, use Shop to open the offers.',action:'preview',focus:'shop-preview-',button:'Preview a hero'},
  {title:'Recruit your first hero',body:'Press Buy on a 1-gold hero. It moves to your bench. Planned heroes from Team Builder have a gold glow when drawn.',action:'buy',focus:'shop-card-buy-',button:'Buy a hero'},
  {title:'Place your hero',body:'Your new hero is selected. Click or drag them to a friendly board tile. If needed, open Controls for named keyboard actions.',action:'deploy',focus:'tile-',button:'Place a hero'},
  {title:'Reveal the whole board',body:'Press Hide shop. The board becomes the focus again; you can reopen the same offers with Open shop whenever preparation is active.',action:'hide-shop',focus:'shop-toggle',button:'Hide shop'},
  {title:'Read team bonuses',body:'Open the ✦ Traits icon. It shows only factions and classes your fielded heroes are working toward. Extra heroes can unlock bonuses.',action:'traits',focus:'traits-icon',button:'Open Traits'},
  {title:'Read hero details',body:'Open the ⓘ Details icon to inspect the selected hero, ability, stats, and active effects. Controls also exposes named actions.',action:'details',focus:'details-icon',button:'Open Details'},
  {title:'Explore items',body:'Open the ◇ Items icon to see each component and completed item by its own symbol. The item dock keeps the battlefield in view while you equip a hero or choose a reward.',action:'items',focus:'items-toggle',button:'Open Items'},
  {title:'Return to the arena',body:'Close the Items panel. Any equipped item stays with its hero until you change it during preparation.',action:'items-close',focus:'items-toggle',button:'Close Items'},
  {title:'Find named controls',body:'Expand Controls for keyboard and screen-reader actions, named board spaces, and the currently selected hero’s description.',action:'controls',focus:'accessible-controls',button:'Open Controls'},
  {title:'Close the control panel',body:'Collapse Controls when you want the full arena back. You can reopen it any time for named actions.',action:'controls-close',focus:'accessible-controls',button:'Close Controls'},
  {title:'Plan your economy',body:'Gold buys heroes or refreshes shop offers. Later rounds grant income and XP; the +4 XP button near the shop spends 4 gold. Your level sets your field limit and improves your chances of seeing higher-cost heroes.',action:null,button:'I understand'},
  {title:'Start combat',body:'Press Begin round. Heroes move, attack, and cast on their own. Surviving enemies damage commander HP; a commander at zero loses.',action:'battle',focus:'battle',button:'Begin round'},
  {title:'You know the basics',body:'Practice and room matches use this same board. Return to the lobby to join people, or use Team Builder to plan your next roster.',action:null,button:'Finish'}
];let step=0;const frame=document.getElementById('arena'),next=document.getElementById('next');function render(){const s=steps[step];document.getElementById('progress').textContent=`STEP ${step+1} OF ${steps.length}`;document.getElementById('title').textContent=s.title;document.getElementById('instruction').textContent=s.body;next.textContent=s.action?s.button:s.button;next.disabled=!!s.action;frame.contentWindow?.postMessage({type:'colilseum-tutorial-focus',focus:s.focus||null},location.origin)}next.onclick=()=>{if(step===steps.length-1){location.href='welcome.html';return;}step++;render();};addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.type!=='colilseum-tutorial-event')return;if(event.data.action===steps[step].action){step++;render();}});frame.addEventListener('load',render);render();
</script></body></html>
