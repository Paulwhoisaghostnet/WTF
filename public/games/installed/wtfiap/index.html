<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lil Guys · Play</title>
<style>html,body{margin:0;background:#0b171a;color:#e8e2cd;font:13px system-ui;height:100%;overflow:hidden}header{height:54px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid #304448}strong{font-size:12px;letter-spacing:2px;color:#dab975;white-space:nowrap}.session-label{color:#a7b6af;white-space:nowrap}#board-mode{margin-left:auto;max-width:215px}select,a{font:inherit;color:inherit;background:#172b2e;border:1px solid #405752;padding:7px 10px;text-decoration:none}a{white-space:nowrap}#demo{font-size:12px;color:#a7b6af;background:transparent;border-color:transparent;padding-left:2px;padding-right:2px}iframe{display:block;border:0;width:100%;height:calc(100% - 55px)}@media(max-width:900px){header{padding:0 8px;gap:6px}.session-label{display:none}#board-mode{max-width:190px}}@media(max-width:560px){strong{font-size:10px;letter-spacing:1px}#board-mode{max-width:145px}header{gap:4px}select,a{padding:7px 5px}#standalone{font-size:12px}}</style></head>
<body><header><strong>Lil Guys</strong><span class="session-label">Local practice</span><select id="board-mode" aria-label="Board mode"><option value="standard">Standard · 3×4 → 8×8</option><option value="tight-quarters">Tight Quarters · 3 → 4 → 5</option><option value="expansive">Expansive · 4×5 → 9×9</option><option value="gated">Gated · Two passages</option><option value="zone-defense">Zone Defense · Territory rewards</option></select><a id="standalone" href="generator.html?mode=match&amp;boardMode=standard&amp;seed=formation-rarity-4" target="_blank" rel="noopener">Open game ↗</a><a href="party.html">Rooms</a><a href="cast.html">Cast v2 ↗</a></header>
<iframe id="frame" title="Playable Lil Guys practice match" allow="fullscreen; orientation-lock"></iframe>
<script>
const boardMode=document.getElementById('board-mode'),frame=document.getElementById('frame'),params=new URLSearchParams(location.search),seed=params.has('seed')?params.get('seed'):'formation-rarity-4';
if([...boardMode.options].some(option=>option.value===params.get('boardMode')))boardMode.value=params.get('boardMode');
function show(){const query=new URLSearchParams({seed,mode:'match',boardMode:boardMode.value}),url='generator.html?'+query.toString();frame.src=url;document.getElementById('standalone').href=url;}
boardMode.onchange=show;show();
</script></body></html>
