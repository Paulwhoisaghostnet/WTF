name: Trace Gallery

# Read-only authenticated trace.  Forges a valid connect.sid cookie
# inside the app container (using the stored SESSION_SECRET and a
# real session row for user 3) and calls /api/gallery/mine against
# localhost.  This exercises the full Express middleware chain +
# Passport auth + the gallery SQL — exactly what the browser does.

on:
  workflow_dispatch:

jobs:
  trace:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Forge cookie + call /api/gallery/mine (user 3)
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose exec -T app node -e "
              const crypto = require(\"crypto\");
              const { Client } = require(\"pg\");

              const SECRET = process.env.SESSION_SECRET;
              if (!SECRET) { console.error(\"no SESSION_SECRET\"); process.exit(1); }

              async function main() {
                const pg = new Client({ connectionString: process.env.DATABASE_URL });
                await pg.connect();
                const r = await pg.query(
                  \`SELECT sid FROM session
                    WHERE (sess::jsonb) -> 'passport' ->> 'user' = '3'
                      AND expire > NOW()
                    ORDER BY expire DESC LIMIT 1\`
                );
                await pg.end();
                if (!r.rows.length) { console.error(\"no live session for user 3\"); process.exit(1); }
                const sid = r.rows[0].sid;

                const sig = crypto
                  .createHmac(\"sha256\", SECRET)
                  .update(sid)
                  .digest(\"base64\")
                  .replace(/=+$/, \"\");
                const signed = \`s:\${sid}.\${sig}\`;
                const cookie = \`connect.sid=\${encodeURIComponent(signed)}\`;

                console.log(\"sid head:\", sid.slice(0, 8), \"…\");
                console.log(\"calling /api/gallery/mine?limit=3 with forged cookie…\");
                const t0 = Date.now();
                const res = await fetch(\"http://127.0.0.1:3000/api/gallery/mine?limit=3\", {
                  headers: { accept: \"application/json\", cookie },
                });
                const ms = Date.now() - t0;
                console.log(\"status:\", res.status, \"in\", ms, \"ms\");
                const ct = res.headers.get(\"content-type\");
                console.log(\"content-type:\", ct);
                const body = await res.text();
                console.log(\"body length:\", body.length);
                console.log(\"body head:\", body.slice(0, 500));
                if (res.status >= 500) process.exit(2);
              }

              main().catch((e) => { console.error(\"fatal:\", e.message, e.stack); process.exit(3); });
            "'

      - name: Tail app logs since call
        if: always()
        run: |
          sleep 2
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose logs --since 2m --tail 60 app 2>&1' \
            | tail -60
