name: Import Intel CSV dump

# One-shot backfill workflow: downloads a compressed tarball of the
# frozen Tezos-Intel Postgres dump from an HTTPS URL (typically a
# Supabase Storage signed URL), verifies its SHA256, ships it into
# the app container, and runs `dist/import-intel-csv.cjs` to merge
# it into WTF's analytics tables.
#
# Prerequisites:
#   1. Tarball has been built locally via `scripts/pack-intel-csv.sh`.
#   2. Tarball is reachable at the HTTPS URL provided below.
#   3. The `dist/import-intel-csv.cjs` bundle exists in the prod image
#      (i.e. main has deployed after the phase-2 schema commit).  If
#      not, this workflow aborts with a clear message.
#
# The importer is idempotent: re-running with the same tarball is a
# no-op for rows that already match.

on:
  workflow_dispatch:
    inputs:
      tarball_url:
        description: "HTTPS URL of a single tarball (.tar.gz).  Leave empty if using manifest_url."
        type: string
        required: false
      manifest_url:
        description: "HTTPS URL of a multi-part manifest.json.  Used when the tarball > 50MB Supabase cap."
        type: string
        required: false
      tarball_sha256:
        description: "SHA256 of the assembled tarball (optional but recommended)"
        type: string
        required: false
      only:
        description: "Comma-separated subset (e.g. `sales,mint_events`). Leave empty for all."
        type: string
        required: false

concurrency:
  group: import-intel-csv
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.tarball_url }}" ] && [ -z "${{ inputs.manifest_url }}" ]; then
            echo "::error::Either tarball_url or manifest_url is required." >&2
            exit 1
          fi

      - name: Write remote import script
        run: |
          cat > /tmp/remote-import.sh <<'EOS'
          #!/usr/bin/env bash
          # $1 = tarball URL (single-file mode, "" if using manifest)
          # $2 = manifest URL (multi-part mode, "" if using single URL)
          # $3 = whole sha256 (optional, "" when skipped)
          # $4 = only-filter (optional, "" for all)
          set -euo pipefail

          TAR_URL="${1:-}"
          MANIFEST_URL="${2:-}"
          TAR_SHA="${3:-}"
          ONLY_ARG="${4:-}"

          cd /opt/platform/repos/wtf-app

          if ! docker compose exec -T app test -f /app/dist/import-intel-csv.cjs; then
            echo "::error::dist/import-intel-csv.cjs missing — deploy main first." >&2
            exit 1
          fi

          STAGING="/tmp/wtf-intel-csv-$$"
          mkdir -p "$STAGING"
          trap 'rm -rf "$STAGING"' EXIT

          TARBALL="$STAGING/dump.tar.gz"

          if [ -n "$MANIFEST_URL" ]; then
            echo "[intel-import] downloading manifest…"
            curl -fSL --retry 3 --retry-delay 5 -o "$STAGING/manifest.json" "$MANIFEST_URL"

            # Manifest shape (written by scripts/upload-intel-csv-to-supabase.mjs):
            #   { version:1, wholeSha256:<hex>, prefix:<str>,
            #     parts:[ { name, sha256, size, signedUrl }, … ] }
            PART_COUNT="$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(len(m["parts"]))' "$STAGING/manifest.json")"
            MANIFEST_WHOLE_SHA="$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m.get("wholeSha256",""))' "$STAGING/manifest.json")"
            echo "[intel-import] manifest has $PART_COUNT parts"

            for i in $(seq 0 $((PART_COUNT - 1))); do
              URL_I="$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["parts"][int(sys.argv[2])]["signedUrl"])' "$STAGING/manifest.json" "$i")"
              NAME_I="$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["parts"][int(sys.argv[2])]["name"])' "$STAGING/manifest.json" "$i")"
              SHA_I="$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["parts"][int(sys.argv[2])]["sha256"])' "$STAGING/manifest.json" "$i")"
              echo "[intel-import] downloading part $NAME_I…"
              curl -fSL --retry 3 --retry-delay 5 -o "$STAGING/$NAME_I" "$URL_I"
              echo "$SHA_I  $STAGING/$NAME_I" | sha256sum -c -
            done

            echo "[intel-import] reassembling parts → $TARBALL"
            cat "$STAGING"/part-* > "$TARBALL"

            # Prefer the manifest's wholeSha256 if caller didn't supply one.
            if [ -z "$TAR_SHA" ] && [ -n "$MANIFEST_WHOLE_SHA" ]; then
              TAR_SHA="$MANIFEST_WHOLE_SHA"
            fi
          else
            echo "[intel-import] downloading tarball…"
            curl -fSL --retry 3 --retry-delay 5 -o "$TARBALL" "$TAR_URL"
          fi

          if [ -n "$TAR_SHA" ]; then
            echo "[intel-import] verifying sha256 of assembled tarball…"
            echo "$TAR_SHA  $TARBALL" | sha256sum -c -
          else
            echo "::warning::No SHA256 provided — skipping integrity check."
          fi

          echo "[intel-import] extracting…"
          tar -xzf "$TARBALL" -C "$STAGING"

          # CSV dir inside the tarball may be:
          #   - objkt-advisor-db-* (Intel dump)
          #   - guidance-csv       (Guidance export)
          CSV_DIR="$(find "$STAGING" -maxdepth 2 -type d \( -name 'objkt-advisor-db-*' -o -name 'guidance-csv' \) | head -1)"
          if [ -z "$CSV_DIR" ]; then
            echo "::error::No CSV directory (objkt-advisor-db-* / guidance-csv) inside tarball." >&2
            exit 1
          fi
          echo "[intel-import] CSV dir: $CSV_DIR"
          ls -lh "$CSV_DIR"

          IN_CONTAINER="/tmp/intel-csv"
          docker compose exec -T app rm -rf "$IN_CONTAINER" || true
          docker compose exec -T app mkdir -p "$IN_CONTAINER"
          docker compose cp "$CSV_DIR" app:"$IN_CONTAINER/"
          CSV_NAME="$(basename "$CSV_DIR")"

          ONLY_FLAG=""
          if [ -n "$ONLY_ARG" ]; then
            ONLY_FLAG="--only=$ONLY_ARG"
          fi
          echo "[intel-import] running bundled importer (this may take 5-15min)…"
          if [ -n "$ONLY_FLAG" ]; then
            docker compose exec -T app \
              node /app/dist/import-intel-csv.cjs \
                "/tmp/intel-csv/$CSV_NAME" "$ONLY_FLAG"
          else
            docker compose exec -T app \
              node /app/dist/import-intel-csv.cjs \
                "/tmp/intel-csv/$CSV_NAME"
          fi

          docker compose exec -T app rm -rf "$IN_CONTAINER" || true
          echo "[intel-import] done."
          EOS
          chmod +x /tmp/remote-import.sh

      - name: Ship + execute import script on server
        env:
          TAR_URL:      ${{ inputs.tarball_url }}
          MANIFEST_URL: ${{ inputs.manifest_url }}
          TAR_SHA:      ${{ inputs.tarball_sha256 }}
          ONLY_ARG:     ${{ inputs.only }}
          HETZ_USER:    ${{ secrets.HETZNER_USER }}
          HETZ_HOST:    ${{ secrets.HETZNER_HOST }}
        run: |
          scp -i ~/.ssh/id_ed25519 \
              /tmp/remote-import.sh \
              "$HETZ_USER@$HETZ_HOST:/tmp/remote-import.sh"
          ssh -i ~/.ssh/id_ed25519 \
              -o ServerAliveInterval=30 \
              "$HETZ_USER@$HETZ_HOST" \
              "bash /tmp/remote-import.sh '$TAR_URL' '$MANIFEST_URL' '$TAR_SHA' '$ONLY_ARG'; EC=\$?; rm -f /tmp/remote-import.sh; exit \$EC"

      - name: Post-import health probe
        if: always()
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
              "curl -sf http://localhost:3000/api/health || echo 'health check soft-failed'"
