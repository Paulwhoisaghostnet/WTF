<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>coLILseum · Practice</title>
  <style>
    :root{color-scheme:dark;--ink:#0b171a;--panel:#13272a;--line:#38514e;--cream:#e8e2cd;--muted:#a2b3ac;--gold:#dab975}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--ink);color:var(--cream);font:14px/1.4 system-ui,sans-serif}
    body{display:flex;flex-direction:column;overflow:hidden}
    .arena-rail{height:46px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
    .mode{font-weight:700;white-space:nowrap}.mode strong{color:var(--gold);letter-spacing:.08em}.mode span{color:var(--muted);font-weight:400}
    .rail-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
    a,summary,select{font:inherit;color:var(--cream);background:#1b3336;border:1px solid var(--line);border-radius:4px}
    a,summary{min-height:36px;padding:7px 11px;text-decoration:none;cursor:pointer}
    a:hover,summary:hover{border-color:var(--gold)}
    a:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
    #standalone{font-size:19px;line-height:20px;min-width:38px;text-align:center}
    details{position:relative}summary{display:flex;align-items:center;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:'⌄';margin-left:9px;color:var(--gold)}
    .options{position:absolute;right:0;top:43px;z-index:10;width:min(300px,calc(100vw - 20px));padding:16px;background:var(--panel);border:1px solid var(--gold);box-shadow:0 15px 35px #0009}
    .options label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px}
    .options select{width:100%;min-height:40px;padding:7px 9px}
    .option-links{display:flex;gap:8px;margin-top:14px}.option-links a{flex:1;text-align:center}
    iframe{display:block;flex:1;min-height:0;width:100%;border:0;background:var(--ink)}
    @media(max-width:560px){.arena-rail{padding:0 8px;gap:6px}.mode strong{font-size:12px}.mode span{display:none}.rail-actions{gap:5px}summary{font-size:12px;padding:7px 8px}}
  </style>
</head>
<body>
  <header class="arena-rail">
    <div class="mode"><strong>coLILseum</strong><span> · Practice</span></div>
    <div class="rail-actions">
      <a id="standalone" href="generator.html?mode=match&amp;boardMode=standard&amp;seed=formation-rarity-4" target="_blank" rel="noopener" aria-label="Open practice in a new tab" title="Open practice in a new tab">↗</a>
      <details id="practice-options">
        <summary>Board options</summary>
        <div class="options">
          <label for="board-mode">Board mode</label>
          <select id="board-mode">
            <option value="standard">Standard · 3×4 → 8×8</option>
            <option value="tight-quarters">Tight Quarters · 3 → 4 → 5</option>
            <option value="expansive">Expansive · 4×5 → 9×9</option>
            <option value="gated">Gated · Two passages</option>
            <option value="zone-defense">Zone Defense · Territory rewards</option>
          </select>
          <nav class="option-links" aria-label="Practice links"><a href="party.html">Rooms</a><a href="cast.html">Heroes</a></nav>
        </div>
      </details>
    </div>
  </header>
  <iframe id="frame" title="Playable coLILseum practice match" allow="fullscreen; orientation-lock"></iframe>
  <script>
    const boardMode=document.getElementById('board-mode'),frame=document.getElementById('frame'),params=new URLSearchParams(location.search),seed=params.has('seed')?params.get('seed'):'formation-rarity-4';
    if([...boardMode.options].some(option=>option.value===params.get('boardMode')))boardMode.value=params.get('boardMode');
    function show(){const query=new URLSearchParams({seed,mode:'match',boardMode:boardMode.value}),url='generator.html?'+query.toString();frame.src=url;document.getElementById('standalone').href=url;}
    boardMode.onchange=()=>{show();document.getElementById('practice-options').open=false;};show();
  </script>
</body>
</html>
