<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindWalk — by skllzrmy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080814;
      color: #e0e0f0;
      font-family: 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────── */
    #header {
      flex-shrink: 0;
      background: rgba(0, 10, 30, 0.9);
      border-bottom: 1px solid rgba(0, 200, 255, 0.25);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    #header h1 {
      font-size: 15px;
      letter-spacing: 2px;
      color: #00ccff;
      text-shadow: 0 0 8px #00ccff;
      white-space: nowrap;
    }
    #header h1 span { color: #aaa; font-size: 11px; margin-left: 6px; }

    #seed-input {
      flex: 1;
      min-width: 140px;
      background: rgba(0,30,60,0.8);
      border: 1px solid #00ccff44;
      color: #e0e0f0;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      border-radius: 2px;
    }
    #seed-input:focus { border-color: #00ccff; box-shadow: 0 0 6px #00ccff44; }

    .btn {
      background: transparent;
      border: 1px solid currentColor;
      color: #00ccff;
      padding: 5px 12px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.15s;
    }
    .btn:hover { background: rgba(0,200,255,0.12); }
    .btn.danger { color: #ff4466; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── AI Config panel ─────────────────────────────────── */
    #ai-panel {
      flex-shrink: 0;
      background: rgba(0,5,20,0.85);
      border-bottom: 1px solid rgba(100,60,200,0.2);
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 11px;
    }
    #ai-panel label { color: #8888aa; }

    select {
      background: rgba(10,10,30,0.9);
      border: 1px solid #6644cc44;
      color: #ccccee;
      padding: 3px 8px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      border-radius: 2px;
    }

    #key-input {
      background: rgba(10,10,30,0.9);
      border: 1px solid #6644cc44;
      color: #ccccee;
      padding: 3px 8px;
      font-family: inherit;
      font-size: 11px;
      border-radius: 2px;
      width: 220px;
      letter-spacing: 1px;
    }
    #key-input:focus { outline: none; border-color: #aa88ff; }

    #ai-status {
      margin-left: auto;
      color: #55aaff;
      font-size: 10px;
    }
    #ai-status.active { color: #00ff88; }
    #ai-status.error  { color: #ff4466; }

    /* ── Canvas ──────────────────────────────────────────── */
    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* ── Footer ──────────────────────────────────────────── */
    #footer {
      flex-shrink: 0;
      background: rgba(0,10,30,0.9);
      border-top: 1px solid rgba(0,200,255,0.15);
      padding: 5px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 10px;
      color: #556677;
    }
    #history-list { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #history-list span { color: #7799bb; margin-right: 6px; }
    #history-list span::after { content: " →"; }
    #pending-indicator { color: #ffcc00; display: none; }
    #pending-indicator.show { display: inline; }

    /* ── Key-save tooltip ────────────────────────────────── */
    #save-key-btn { color: #aa88ff; }

    /* Privacy notice */
    #privacy-note {
      font-size: 9px;
      color: #334455;
      padding: 3px 14px;
      background: rgba(0,0,0,0.4);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Header: seed input + controls -->
  <div id="header">
    <h1>MINDWALK<span>by skllzrmy</span></h1>
    <input id="seed-input" type="text" placeholder="Enter a concept to explore…" maxlength="60" autocomplete="off" />
    <button class="btn" id="start-btn">Walk</button>
    <button class="btn danger" id="clear-btn">Clear</button>
  </div>

  <!-- AI provider selector -->
  <div id="ai-panel">
    <label for="provider-select">AI PROVIDER</label>
    <select id="provider-select">
      <option value="">— offline mode —</option>
      <option value="gemini">Gemini (Google)</option>
      <option value="openai">GPT (OpenAI)</option>
      <option value="claude">Claude (Anthropic)</option>
    </select>

    <label for="key-input" id="key-label">API KEY</label>
    <input id="key-input" type="password" placeholder="Paste your BYOK key…" autocomplete="off" />
    <button class="btn" id="save-key-btn" title="Save key to localStorage">Save key</button>
    <button class="btn danger" id="clear-key-btn" title="Forget saved key">Forget</button>

    <span id="ai-status">offline</span>
  </div>

  <!-- Game canvas -->
  <div id="canvas-wrap">
    <canvas id="game-canvas"></canvas>
  </div>

  <!-- Footer: trail history -->
  <div id="footer">
    <span>PATH:</span>
    <div id="history-list"></div>
    <span id="pending-indicator">⧗ thinking…</span>
  </div>

  <div id="privacy-note">
    API keys are stored only in your browser's localStorage — never sent to WTF servers.
    All AI calls are direct from your browser to the provider.
  </div>

  <script src="js/game.js"></script>
  <script>
    (function () {
      "use strict";

      const canvas    = document.getElementById("game-canvas");
      const seedInput = document.getElementById("seed-input");
      const startBtn  = document.getElementById("start-btn");
      const clearBtn  = document.getElementById("clear-btn");
      const provSel   = document.getElementById("provider-select");
      const keyInput  = document.getElementById("key-input");
      const saveKeyBtn  = document.getElementById("save-key-btn");
      const clearKeyBtn = document.getElementById("clear-key-btn");
      const aiStatus  = document.getElementById("ai-status");
      const historyEl = document.getElementById("history-list");
      const pendingEl = document.getElementById("pending-indicator");

      // ── Load saved provider + key from localStorage ────────────────────
      const LS_PREFIX = "mindwalk_";

      function lsKey(provider) { return `${LS_PREFIX}key_${provider}`; }

      function loadSavedKey(provider) {
        if (!provider) return "";
        return localStorage.getItem(lsKey(provider)) || "";
      }

      function updateKeyField() {
        const saved = loadSavedKey(provSel.value);
        keyInput.value = saved ? "••••••••••••••••" : "";
        keyInput.dataset.saved = saved ? "1" : "";
        applyProvider();
      }

      function applyProvider() {
        const provider = provSel.value;
        const savedKey = loadSavedKey(provider);
        const liveKey  = keyInput.dataset.saved ? savedKey : keyInput.value.trim();
        if (provider && liveKey) {
          MindWalk.setProvider(provider, liveKey);
          aiStatus.textContent = `${provider} ✓`;
          aiStatus.className = "active";
        } else if (provider) {
          MindWalk.setProvider(null, null);
          aiStatus.textContent = `${provider} — no key`;
          aiStatus.className = "error";
        } else {
          MindWalk.setProvider(null, null);
          aiStatus.textContent = "offline";
          aiStatus.className = "";
        }
      }

      provSel.addEventListener("change", updateKeyField);

      keyInput.addEventListener("focus", () => {
        if (keyInput.dataset.saved) {
          keyInput.value = "";
          keyInput.dataset.saved = "";
        }
      });

      keyInput.addEventListener("input", () => {
        keyInput.dataset.saved = "";
        applyProvider();
      });

      saveKeyBtn.addEventListener("click", () => {
        const provider = provSel.value;
        const key = keyInput.value.trim();
        if (!provider) { alert("Select a provider first."); return; }
        if (!key || key.startsWith("•")) { alert("Enter the actual key to save it."); return; }
        localStorage.setItem(lsKey(provider), key);
        keyInput.dataset.saved = "1";
        keyInput.value = "••••••••••••••••";
        applyProvider();
      });

      clearKeyBtn.addEventListener("click", () => {
        const provider = provSel.value;
        if (provider) localStorage.removeItem(lsKey(provider));
        keyInput.value = "";
        keyInput.dataset.saved = "";
        applyProvider();
      });

      // ── Game controls ─────────────────────────────────────────────────
      function doWalk() {
        const seed = seedInput.value.trim();
        if (!seed) return;
        MindWalk.startWalk(seed);
      }

      startBtn.addEventListener("click", doWalk);
      seedInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") doWalk();
      });
      clearBtn.addEventListener("click", () => {
        MindWalk.clearWalk();
        seedInput.value = "";
        historyEl.innerHTML = "";
      });

      // ── Poll game state for UI updates ────────────────────────────────
      function pollState() {
        const s = MindWalk.getState();

        // Pending spinner
        pendingEl.classList.toggle("show", !!s.pending);
        startBtn.disabled = !!s.pending;

        // History trail
        if (s.history.length > 0) {
          historyEl.innerHTML = s.history
            .slice(-12)
            .map(h => `<span>${h}</span>`)
            .join("");
        }

        requestAnimationFrame(pollState);
      }

      // ── Restore last provider ─────────────────────────────────────────
      const lastProvider = localStorage.getItem(`${LS_PREFIX}last_provider`) || "";
      if (lastProvider) {
        provSel.value = lastProvider;
      }
      provSel.addEventListener("change", () => {
        localStorage.setItem(`${LS_PREFIX}last_provider`, provSel.value);
      });
      updateKeyField();

      // ── Init ──────────────────────────────────────────────────────────
      MindWalk.init(canvas);
      pollState();

      // WTF hiscore stub (no-op if lib absent)
      if (window.WTFHiscore) {
        window.WTFHiscore.trackSession({ game: "mindwalk", creator: "skllzrmy" });
      }
    })();
  </script>
</body>
</html>
