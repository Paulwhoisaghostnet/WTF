services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wtf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wtf
    volumes:
      - ${POSTGRES_DATA_DIR:-/mnt/wtf-data/postgres}:/var/lib/postgresql/data
    # Docker's default `/dev/shm` is only 64 MB, which Postgres exhausts
    # the moment a parallel query plans its dynamic shared memory
    # segments.  That manifested as the gallery 500'ing for users with
    # ~7k+ holdings (the facet queries trigger parallel workers on
    # large LEFT JOINs over token_metadata).  1 GB is plenty for this
    # workload; raise only if SELECT pg_shmem_allocations() ever
    # approaches it.
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtf -d wtf"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        COMMIT_SHA: ${COMMIT_SHA:-dev}
        VITE_MARKETPLACE_CONTRACT_ADDRESS: ${VITE_MARKETPLACE_CONTRACT_ADDRESS:-}
        VITE_BARTER_CONTRACT_ADDRESS: ${VITE_BARTER_CONTRACT_ADDRESS:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${WTF_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://wtf:${POSTGRES_PASSWORD}@postgres:5432/wtf
      NODE_ENV: production
      COMMIT_SHA: ${COMMIT_SHA:-dev}
      COMMIT_REF: ${COMMIT_SHA:-dev}
      WTF_DATA_ROOT: /mnt/wtf-data
      UPLOAD_STAGING_DIR: /app/uploads-staging
      MEDIA_HOT_CACHE_DIR: /app/cache/users
      GM_NFT_CACHE_DIR: /app/cache/gm-nfts
      TMP_PROCESSING_DIR: /app/tmp-processing
      BACKUPS_STAGING_DIR: /app/backups
      TV_CACHE_DIR: /app/cache/tv
      BUMPER_UPLOADS_DIR: /app/cache/bumpers
      W_TIMELINE_STREAM_HANDLES_FILE: ${W_TIMELINE_STREAM_HANDLES_FILE:-/app/config/w-stream-handles.txt}
      MEDIA_UPLOAD_MAX_BYTES: ${MEDIA_UPLOAD_MAX_BYTES:-26214400}
      MEDIA_HOT_CACHE_MAX_BYTES: ${MEDIA_HOT_CACHE_MAX_BYTES:-32212254720}
      VOLUME_RESERVED_FREE_BYTES: ${VOLUME_RESERVED_FREE_BYTES:-16106127360}
      OBJECT_STORAGE_LIMIT_BYTES: ${OBJECT_STORAGE_LIMIT_BYTES:-1040450734080}
      OBJECT_STORAGE_WARN_80_BYTES: ${OBJECT_STORAGE_WARN_80_BYTES:-832360587264}
      OBJECT_STORAGE_WARN_90_BYTES: ${OBJECT_STORAGE_WARN_90_BYTES:-936405660672}
      OBJECT_STORAGE_PROTECT_95_BYTES: ${OBJECT_STORAGE_PROTECT_95_BYTES:-988428527616}
    volumes:
      - ${WTF_OPERATOR_SIGNER_RUN_DIR_HOST:-/run/wtf}:/run/wtf
      - ${UPLOAD_STAGING_DIR_HOST:-/mnt/wtf-data/uploads-staging}:/app/uploads-staging
      - ${TV_CACHE_DIR_HOST:-/mnt/wtf-data/tv-cache}:/app/cache
      - ${TMP_PROCESSING_DIR_HOST:-/mnt/wtf-data/tmp-processing}:/app/tmp-processing
      - ${BACKUPS_STAGING_DIR_HOST:-/mnt/wtf-data/backups-staging}:/app/backups
      - ${APP_LOG_DIR_HOST:-/var/log/wtf/app}:/app/logs
      - ${WTF_CONFIG_DIR_HOST:-/mnt/wtf-data/config}:/app/config:ro
    ports:
      - "127.0.0.1:3000:3000"
    # Allow the app to reach native host services (e.g. kiln.service on :3001)
    # via `host.docker.internal`. Linux does not populate this by default; the
    # `host-gateway` alias was added in Docker 20.10+.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  wtfos-pds:
    image: ghcr.io/bluesky-social/pds:0.4
    restart: unless-stopped
    profiles:
      - wtfos-pds
    environment:
      PDS_HOSTNAME: ${WTFOS_PDS_HOSTNAME:-pds.wtfgameshow.app}
      PDS_JWT_SECRET: ${WTFOS_PDS_JWT_SECRET:-}
      PDS_ADMIN_PASSWORD: ${WTFOS_PDS_ADMIN_PASSWORD:-}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${WTFOS_PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX:-}
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_DID_PLC_URL: ${WTFOS_PDS_DID_PLC_URL:-https://plc.directory}
      PDS_BSKY_APP_VIEW_URL: ${WTFOS_PDS_BSKY_APP_VIEW_URL:-https://api.bsky.app}
      PDS_BSKY_APP_VIEW_DID: ${WTFOS_PDS_BSKY_APP_VIEW_DID:-did:web:api.bsky.app}
      PDS_REPORT_SERVICE_URL: ${WTFOS_PDS_REPORT_SERVICE_URL:-https://mod.bsky.app}
      PDS_REPORT_SERVICE_DID: ${WTFOS_PDS_REPORT_SERVICE_DID:-did:plc:ar7c4by46qjdydhdevvrndac}
      PDS_CRAWLERS: ${WTFOS_PDS_CRAWLERS:-https://bsky.network}
      PDS_INVITE_REQUIRED: ${WTFOS_PDS_INVITE_REQUIRED:-true}
      PDS_RATE_LIMITS_ENABLED: ${WTFOS_PDS_RATE_LIMITS_ENABLED:-true}
      LOG_ENABLED: "true"
      NODE_ENV: production
    volumes:
      - ${WTFOS_PDS_DATA_DIR:-/mnt/wtf-data/pds}:/pds
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/xrpc/_health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Allow Caddy to reach native host services (e.g. kiln.service on :3001)
    # via `host.docker.internal`. Linux does not populate this by default; the
    # `host-gateway` alias was added in Docker 20.10+.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 1.1.1.1
      - 8.8.8.8

volumes:
  caddy_data:
  caddy_config:
