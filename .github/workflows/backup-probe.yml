name: Backup Probe

# Read-only: print the size of the newest pg_dump on disk so we know
# whether the Supabase bucket file_size_limit needs bumping, and
# print the bucket's current config so we can see the limit.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Inspect latest dump + Supabase bucket config
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "cd /opt/platform/repos/wtf-app && docker compose exec -T app sh -c '
              echo \"--- local dump listing ---\"
              ls -lh /app/backups/ 2>/dev/null || echo \"(no backups dir)\"
              echo
              echo \"--- bucket config ---\"
              curl -sS \
                -H \"apikey: \$SUPABASE_SERVICE_ROLE_KEY\" \
                -H \"Authorization: Bearer \$SUPABASE_SERVICE_ROLE_KEY\" \
                \"\$SUPABASE_URL/storage/v1/bucket/wtf-backups\" || true
              echo
              echo \"--- project plan info (if exposed) ---\"
              curl -sS \
                -H \"apikey: \$SUPABASE_SERVICE_ROLE_KEY\" \
                -H \"Authorization: Bearer \$SUPABASE_SERVICE_ROLE_KEY\" \
                \"\$SUPABASE_URL/storage/v1/bucket\" || true
            '"
