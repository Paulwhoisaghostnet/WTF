name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" << 'EOF'
            set -e
            cd /opt/platform/repos/wtf-app

            if [ ! -f .env ]; then
              echo "ERROR: .env is missing. Create it before deploying."
              exit 1
            fi

            git fetch origin
            git reset --hard origin/main

            COMMIT_SHA=$(git rev-parse --short HEAD)
            export COMMIT_SHA

            # ── Kill any rogue standalone caddy containers ──────────────
            for cid in $(docker ps -aq --filter "name=^caddy$" 2>/dev/null); do
              NAME=$(docker inspect --format '{{.Name}}' "$cid" 2>/dev/null || true)
              if [ "$NAME" != "/wtf-app-caddy-1" ]; then
                echo "Removing rogue caddy container: $cid ($NAME)"
                docker stop "$cid" 2>/dev/null || true
                docker rm -f "$cid" 2>/dev/null || true
              fi
            done

            # ── KVM auto-detection for TempleOS ─────────────────────────
            # Only mount /dev/kvm into the templeos container when the
            # host actually exposes it (dedicated servers + certain
            # Hetzner Cloud plans).  Otherwise drop the override so
            # docker compose doesn't fail on a missing device.
            if [ -e /dev/kvm ]; then
              echo "Host exposes /dev/kvm — enabling hardware acceleration for templeos"
              printf 'services:\n  templeos:\n    devices:\n      - /dev/kvm:/dev/kvm\n' > docker-compose.override.yml
            else
              echo "Host has no /dev/kvm — templeos will run under TCG"
              rm -f docker-compose.override.yml
            fi

            # ── Build and deploy ────────────────────────────────────────
            docker compose build --no-cache --build-arg COMMIT_SHA="$COMMIT_SHA" app
            docker compose build templeos
            docker compose down --remove-orphans
            sleep 2

            # Retry `up -d` to absorb the occasional Docker "No such
            # container" race after a full teardown. We retry up to 3
            # times, cleaning up between attempts.
            up_attempts=0
            until docker compose up -d --remove-orphans; do
              up_attempts=$((up_attempts + 1))
              if [ "$up_attempts" -ge 3 ]; then
                echo "docker compose up -d failed after $up_attempts attempts"
                docker compose ps || true
                docker compose logs --tail=60 || true
                exit 1
              fi
              echo "compose up failed (attempt $up_attempts); cleaning up and retrying in 5s..."
              docker compose down --remove-orphans || true
              sleep 5
            done

            echo "Waiting 10s for app to start..."
            sleep 10

            # ── Apply cockpit backfill SQL BEFORE drizzle-kit push ──────
            # drizzle-kit push --force will drop user_owned_tokens because
            # it was removed from the schema in Phase 6.  cockpit_all.sql
            # is fully idempotent and does the backfill + table creation
            # first so no data is lost, then drops the legacy table itself
            # (after which drizzle-kit push is a no-op for that branch).
            if [ -f drizzle/cockpit_all.sql ]; then
              echo "Applying drizzle/cockpit_all.sql to the postgres container..."
              docker compose exec -T postgres psql -U wtf -d wtf \
                -v ON_ERROR_STOP=1 < drizzle/cockpit_all.sql
            else
              echo "WARN: drizzle/cockpit_all.sql missing — skipping cockpit backfill"
            fi

            # ── Apply DB migrations ─────────────────────────────────────
            docker compose exec -T app npx drizzle-kit push --force
            docker compose restart app
            sleep 5

            docker image prune -f
          EOF

      - name: Health check
        run: |
          echo "Waiting 15s for app restart..."
          sleep 15
          for i in 1 2 3 4 5; do
            STATUS=$(ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
              "curl -sf http://localhost:3000/api/health 2>/dev/null || echo FAIL")
            if echo "$STATUS" | grep -q '"status":"ok"'; then
              echo "Health check passed: $STATUS"
              exit 0
            fi
            echo "Attempt $i: $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed — dumping container logs:"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "cd /opt/platform/repos/wtf-app && docker compose logs --tail=40 app"
          exit 1
