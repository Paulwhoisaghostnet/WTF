<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inverse Snake — WTF Games</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0a18;
        color: #e7f0ff;
        font-family: "Courier New", ui-monospace, monospace;
        height: 100%;
        overflow: hidden;
      }
      #wrap {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      canvas {
        background: #12122a;
        border: 2px solid #2b2b55;
        box-shadow: 0 0 40px rgba(88, 90, 255, 0.2);
        image-rendering: pixelated;
        max-width: 95vmin;
        max-height: 95vmin;
      }
      #hud {
        position: absolute;
        top: 8px;
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: #a6b0d6;
        pointer-events: none;
        text-shadow: 0 0 6px #0a0a18;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(10, 10, 24, 0.85);
        flex-direction: column;
        gap: 12px;
        pointer-events: auto;
      }
      #overlay h1 {
        font-size: 28px;
        margin: 0;
        color: #ff8a9b;
      }
      #overlay p {
        margin: 0;
        color: #a6b0d6;
        max-width: 380px;
        text-align: center;
        line-height: 1.4;
      }
      button {
        background: #2b2b55;
        color: #e7f0ff;
        font-family: inherit;
        font-size: 15px;
        padding: 8px 18px;
        border: 1px solid #52568f;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #3a3a75;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="hud">
        <span id="hud-score">Score: 0</span>
        <span id="hud-best">Best: —</span>
      </div>
      <canvas id="game" width="480" height="480"></canvas>
      <div id="overlay">
        <h1 id="overlay-title">Inverse Snake</h1>
        <p id="overlay-text">
          The apple chases you. Don't let it catch your head. Every second
          you stay alive = 1 point. Eating a wall also ends the run.
        </p>
        <button id="overlay-btn">Start</button>
      </div>
    </div>
    <script src="../_lib/hiscore-client.js"></script>
    <script>
      (function () {
        "use strict";
        var GRID = 24;
        var CELL = 20;
        var canvas = document.getElementById("game");
        canvas.width = GRID * CELL;
        canvas.height = GRID * CELL;
        var ctx = canvas.getContext("2d");

        var hudScore = document.getElementById("hud-score");
        var hudBest = document.getElementById("hud-best");
        var overlay = document.getElementById("overlay");
        var overlayTitle = document.getElementById("overlay-title");
        var overlayText = document.getElementById("overlay-text");
        var overlayBtn = document.getElementById("overlay-btn");

        var best = Number(localStorage.getItem("wtf-inverse-snake-best") || 0);
        hudBest.textContent = "Best: " + best;

        var running = false;
        var tick = 0;
        var snake = [];
        var dir = { x: 1, y: 0 };
        var pendingDir = dir;
        var apple = { x: 1, y: 1 };
        var tickRate = 8; // ticks per logical second (snake moves this fast)
        var startedAt = 0;

        function reset() {
          var mid = Math.floor(GRID / 2);
          snake = [
            { x: mid, y: mid },
            { x: mid - 1, y: mid },
            { x: mid - 2, y: mid },
          ];
          dir = { x: 1, y: 0 };
          pendingDir = dir;
          apple = { x: 2, y: 2 };
          startedAt = performance.now();
          tick = 0;
        }

        function showOverlay(title, text, buttonLabel) {
          overlay.style.display = "flex";
          overlayTitle.textContent = title;
          overlayText.textContent = text;
          overlayBtn.textContent = buttonLabel || "Start";
        }

        function hideOverlay() {
          overlay.style.display = "none";
        }

        function onKey(ev) {
          var k = ev.key;
          if (!running) return;
          if (k === "ArrowUp" && dir.y === 0) pendingDir = { x: 0, y: -1 };
          else if (k === "ArrowDown" && dir.y === 0) pendingDir = { x: 0, y: 1 };
          else if (k === "ArrowLeft" && dir.x === 0) pendingDir = { x: -1, y: 0 };
          else if (k === "ArrowRight" && dir.x === 0) pendingDir = { x: 1, y: 0 };
        }
        window.addEventListener("keydown", onKey, false);

        function moveApple() {
          // Apple steps toward snake head, Chebyshev-metric with jitter.
          var head = snake[0];
          var dx = Math.sign(head.x - apple.x);
          var dy = Math.sign(head.y - apple.y);
          if (Math.random() < 0.35) {
            // Occasional random drift so the apple can corner the snake.
            if (Math.random() < 0.5) dx = Math.random() < 0.5 ? -1 : 1;
            else dy = Math.random() < 0.5 ? -1 : 1;
          }
          apple.x = Math.max(0, Math.min(GRID - 1, apple.x + dx));
          apple.y = Math.max(0, Math.min(GRID - 1, apple.y + dy));
        }

        function gameOver(reason) {
          running = false;
          var score = Math.max(0, Math.floor((performance.now() - startedAt) / 1000));
          if (score > best) {
            best = score;
            localStorage.setItem("wtf-inverse-snake-best", String(best));
            hudBest.textContent = "Best: " + best;
          }
          if (window.WtfHiScore && score > 0) {
            window.WtfHiScore.setPayloadBuilder(function () {
              return { reason: reason, bestLocal: best };
            });
            window.WtfHiScore.submit(score);
          }
          showOverlay(
            "Game over",
            "You survived " + score + "s. Reason: " + reason + ". Another?",
            "Play again"
          );
        }

        function step() {
          dir = pendingDir;
          var head = snake[0];
          var next = { x: head.x + dir.x, y: head.y + dir.y };
          if (
            next.x < 0 ||
            next.x >= GRID ||
            next.y < 0 ||
            next.y >= GRID
          ) {
            return gameOver("wall");
          }
          for (var i = 0; i < snake.length; i++) {
            if (snake[i].x === next.x && snake[i].y === next.y) {
              return gameOver("self");
            }
          }
          snake.unshift(next);
          snake.pop();
          moveApple();
          if (apple.x === next.x && apple.y === next.y) {
            return gameOver("apple");
          }
        }

        function draw() {
          ctx.fillStyle = "#0b0b1a";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.strokeStyle = "#1a1a36";
          ctx.lineWidth = 1;
          for (var g = 0; g <= GRID; g++) {
            ctx.beginPath();
            ctx.moveTo(g * CELL, 0);
            ctx.lineTo(g * CELL, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, g * CELL);
            ctx.lineTo(canvas.width, g * CELL);
            ctx.stroke();
          }

          // Apple (predator): red, glowing.
          ctx.fillStyle = "#ff3b5c";
          ctx.shadowColor = "#ff3b5c";
          ctx.shadowBlur = 12;
          ctx.fillRect(apple.x * CELL + 2, apple.y * CELL + 2, CELL - 4, CELL - 4);
          ctx.shadowBlur = 0;

          // Snake (prey).
          for (var i = 0; i < snake.length; i++) {
            var s = snake[i];
            ctx.fillStyle = i === 0 ? "#7be0ff" : "#3a9ec9";
            ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
          }

          var score = running
            ? Math.max(0, Math.floor((performance.now() - startedAt) / 1000))
            : 0;
          hudScore.textContent = "Score: " + score;
        }

        function loop() {
          if (running) {
            tick++;
            if (tick % Math.max(1, Math.floor(60 / tickRate)) === 0) {
              step();
            }
          }
          draw();
          requestAnimationFrame(loop);
        }

        overlayBtn.addEventListener("click", function () {
          hideOverlay();
          reset();
          running = true;
        });

        if (window.WtfHiScore) {
          window.WtfHiScore.init("inverse-snake");
        }
        showOverlay(
          "Inverse Snake",
          "The apple chases you. Don't let it catch your head. Every second you stay alive = 1 point. Eating a wall also ends the run.",
          "Start"
        );
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
