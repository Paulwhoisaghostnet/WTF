<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>coLILseum</title>
<style>
:root{color-scheme:dark;--cream:#f4eedc;--gold:#e9bd68}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(ellipse at 50% 35%,#243b3a,#081618 75%);color:var(--cream);font:16px/1.5 system-ui,sans-serif;overflow:auto}a,button{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.stage{min-height:100%;display:grid;place-items:center;padding:12px}.splash{width:min(920px,100%);text-align:center}.eyebrow{margin:0 0 4px;color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.28em}.brand{display:block;width:min(100%,760px);max-height:clamp(65px,16vh,130px);object-fit:contain;margin:0 auto;filter:drop-shadow(0 8px 30px #000a)}.sub{margin:4px auto 14px;color:#c3d1c9;max-width:48ch}.cast{display:flex;align-items:end;justify-content:center;height:clamp(85px,19vh,180px);margin:0 auto 6px;gap:clamp(4px,2vw,20px);filter:drop-shadow(0 16px 18px #0008)}.cast img{height:100%;width:min(25%,180px);object-fit:contain}.cast img:nth-child(1){transform:rotate(-9deg) translateY(12px)}.cast img:nth-child(2){transform:scale(1.13);z-index:1}.cast img:nth-child(3){transform:rotate(8deg) translateY(14px)}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.choices a{min-height:72px;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:14px;border:1px solid #66837d;border-radius:12px;background:#173032e8;color:var(--cream);text-decoration:none;box-shadow:0 8px 24px #0005;transition:transform .15s,border-color .15s,background .15s}.choices a:hover{transform:translateY(-4px);border-color:var(--gold);background:#29453f}.choices strong{font-size:20px}.choices small{color:#bfd0c6}.credit{margin:22px 0 0;color:#91a9a0;font-size:12px;letter-spacing:.08em}
.intro{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#081516;color:var(--cream);text-align:center}.intro[hidden]{display:none}.intro-copy{padding:24px;animation:arrive 1.3s ease both}.intro-copy p{color:var(--gold);font-weight:800;letter-spacing:.3em;text-transform:uppercase}.intro-copy strong{display:block;font:clamp(2rem,7vw,5rem) Georgia,serif}.intro-copy em{display:block;margin-top:16px;color:#a9c0b4;font-style:normal;letter-spacing:.15em}.skip-intro{position:absolute;right:18px;top:18px;padding:10px 15px;border:1px solid #8ea89a;border-radius:7px;background:#173032;color:var(--cream);cursor:pointer}@keyframes arrive{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}@keyframes leave{to{opacity:0;transform:scale(1.07)}}
@media(max-width:650px){.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.choices a{min-height:76px}.choices strong{font-size:17px}.cast{height:95px}}@media(prefers-reduced-motion:reduce){.intro{display:none}.choices a{transition:none}}
</style></head><body><div class="stage"><main class="splash"><p class="eyebrow">Lil Guys Present's</p><p class="eyebrow">A FAFO lab game</p><div class="cast" aria-hidden="true"><img src="hero-art/ember-ranger.png" alt=""><img src="hero-art/rime-boruun.png" alt=""><img src="hero-art/tide-mender.png" alt=""></div><img class="brand" src="colilseum-brand.svg" alt="coLILseum"><p class="sub">Build a little team. Make a big scene. Pick your heroes, find their allies, and watch every round unfold.</p><nav class="choices" aria-label="Start game"><a href="index.html"><strong>Practice</strong><small>Play a solo match</small></a><a href="party.html"><strong>Lobby</strong><small>Join, host, or watch</small></a><a href="learn.html"><strong>Learn</strong><small>Guided first round</small></a><a href="team-builder.html"><strong>Team Builder</strong><small>Plan your lineup</small></a></nav></main></div>
<div id="intro" class="intro" role="status" aria-label="Lil Guys Present’s. A FAFO lab game. coLILseum."><button id="skip" class="skip-intro" type="button">Skip intro</button><div id="intro-copy" class="intro-copy"><p>Lil Guys Present's</p><em>A FAFO lab game</em><img class="brand" src="colilseum-brand.svg" alt="coLILseum"></div></div>
<script>const intro=document.getElementById('intro'),copy=document.getElementById('intro-copy');function finish(){intro.hidden=true;document.querySelector('.choices a').focus({preventScroll:true})}document.getElementById('skip').onclick=finish;if(matchMedia('(prefers-reduced-motion: reduce)').matches)finish();else copy.addEventListener('animationend',()=>{copy.style.animation='leave .7s ease forwards';copy.addEventListener('animationend',finish,{once:true})},{once:true});</script></body></html>
