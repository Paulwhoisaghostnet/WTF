services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wtf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wtf
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtf -d wtf"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        COMMIT_SHA: ${COMMIT_SHA:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://wtf:${POSTGRES_PASSWORD}@postgres:5432/wtf
      NODE_ENV: production
      COMMIT_REF: ${COMMIT_SHA:-dev}
    volumes:
      - uploads:/app/uploads
      - cache:/app/cache
      - backups:/app/backups
    ports:
      - "127.0.0.1:3000:3000"

  templeos:
    build:
      context: ./infrastructure/templeos
    restart: unless-stopped
    # KVM for 100-1000x speedup when the host exposes /dev/kvm.
    # Hetzner CPX + CX22 instances ship KVM on by default; if the host
    # doesn't have it, the entrypoint falls back to TCG automatically
    # and this mount becomes a no-op.
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - templeos_data:/opt/templeos/data
    expose:
      - "6080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6080/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
      - templeos
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    dns:
      - 1.1.1.1
      - 8.8.8.8

volumes:
  pgdata:
  uploads:
  cache:
  backups:
  caddy_data:
  caddy_config:
  templeos_data:
