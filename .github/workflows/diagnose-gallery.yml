name: Diagnose Gallery

# Read-only diagnostic for the /api/gallery/mine endpoint.  Pulls
# recent app-container logs that mention gallery errors, queries the
# same shape the gallery route asks for against the prod DB, and
# reports on execution time, row counts, and any SQL errors.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Recent gallery log lines
        run: |
          echo "=== recent [gallery] log lines (last 30 min) ==="
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose logs --since 30m app 2>&1' \
            | grep -iE "gallery|\[gallery\]|api/gallery" \
            | tail -100 \
            || echo "(no matches)"

      - name: Recent app errors (500s etc.)
        run: |
          echo "=== recent error-shaped lines (last 30 min) ==="
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose logs --since 30m app 2>&1' \
            | grep -iE "error|failed|exception|ECONNR|timeout|504" \
            | grep -viE "no-op|skipped|retry" \
            | tail -100 \
            || echo "(no matches)"

      - name: Query counts for user 1 (primary admin)
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose exec -T postgres psql -U wtf -d wtf -v ON_ERROR_STOP=1' <<'SQL'
          \timing on
          \pset format aligned

          SELECT
            (SELECT count(*)::int FROM wallet_holdings)                                 AS holdings_total,
            (SELECT count(DISTINCT user_id)::int FROM wallet_holdings
               WHERE user_id IS NOT NULL)                                               AS holdings_users,
            (SELECT count(*)::int FROM wallet_holdings WHERE user_id IS NULL)           AS holdings_null_user,
            (SELECT count(*)::int FROM token_metadata)                                  AS tokens_total;

          -- Quick per-user breakdown (who has holdings at all?)
          SELECT user_id,
                 count(*)::int AS holdings,
                 count(*) FILTER (WHERE tzkt_last_time IS NOT NULL)::int AS with_tzkt_time,
                 count(*) FILTER (WHERE last_activity_at IS NOT NULL)::int AS with_derived_time,
                 count(*) FILTER (WHERE derived_at IS NOT NULL)::int AS with_derived_at
            FROM wallet_holdings
           GROUP BY user_id
           ORDER BY holdings DESC
           LIMIT 20;
          SQL

      - name: Timed gallery-shape query for admin user
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose exec -T postgres psql -U wtf -d wtf -v ON_ERROR_STOP=1' <<'SQL'
          \timing on
          \pset pager off
          \set uid 1

          EXPLAIN (ANALYZE, BUFFERS, FORMAT text)
          SELECT
            h.id,
            h.wallet_address,
            h.token_contract,
            h.token_id,
            tm.name,
            tm.symbol,
            tm.thumbnail,
            h.balance,
            tm.raw,
            (COALESCE(tm.raw, '{}'::jsonb) -> 'creators' ->> 0) AS creator_address,
            COALESCE(h.tzkt_last_time, h.last_activity_at, h.derived_at) AS last_seen_at
            FROM wallet_holdings h
            LEFT JOIN token_metadata tm
              ON tm.token_contract = h.token_contract AND tm.token_id = h.token_id
           WHERE h.user_id = :uid
           ORDER BY COALESCE(h.tzkt_last_time, h.last_activity_at, h.derived_at) DESC,
                    h.id DESC
           LIMIT 60;

          EXPLAIN (ANALYZE, BUFFERS, FORMAT text)
          SELECT count(*)::int
            FROM wallet_holdings h
            LEFT JOIN token_metadata tm
              ON tm.token_contract = h.token_contract AND tm.token_id = h.token_id
           WHERE h.user_id = :uid;
          SQL

      - name: Timed facet queries
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose exec -T postgres psql -U wtf -d wtf -v ON_ERROR_STOP=1' <<'SQL'
          \timing on
          \pset pager off
          \set uid 1

          EXPLAIN (ANALYZE, BUFFERS)
          SELECT
            COALESCE(
              NULLIF((COALESCE(tm.raw, '{}'::jsonb)) ->> 'creator', ''),
              CASE
                WHEN jsonb_typeof((COALESCE(tm.raw, '{}'::jsonb)) -> 'creators') = 'array'
                     AND jsonb_array_length((COALESCE(tm.raw, '{}'::jsonb)) -> 'creators') > 0
                THEN (COALESCE(tm.raw, '{}'::jsonb)) -> 'creators' ->> 0
                ELSE NULL
              END
            ) AS name,
            count(*)::int
            FROM wallet_holdings h
            LEFT JOIN token_metadata tm ON tm.token_contract = h.token_contract AND tm.token_id = h.token_id
           WHERE h.user_id = :uid
           GROUP BY name
           ORDER BY 2 DESC
           LIMIT 50;
          SQL
