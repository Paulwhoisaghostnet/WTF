[build]
  command = "npm run build:netlify"
  publish = "dist/public"
  functions = "dist/functions"

[build.environment]
  NODE_VERSION = "20"
  # Do not set ESBUILD_BINARY_PATH — Netlify’s function bundler ships esbuild 0.27.x; pointing at
  # node_modules/esbuild (different patch) causes "Host version does not match binary version".
  # Install devDependencies (Vite, esbuild) even if Site env sets NODE_ENV=production
  NPM_CONFIG_PRODUCTION = "false"

[functions]
  node_bundler = "esbuild"
  # connect-pg-simple must stay external: it reads table.sql from its package dir; bundling breaks __dirname.
  external_node_modules = ["pg-native", "connect-pg-simple", "passport-google-oauth20", "passport-github2", "passport-twitter", "passport-discord"]
  included_files = ["node_modules/connect-pg-simple/**", "node_modules/passport-twitter/**", "node_modules/passport-github2/**", "node_modules/passport-google-oauth20/**", "node_modules/passport-discord/**", "node_modules/xtraverse/**", "node_modules/xmldom/**"]

[functions."token-sync"]
  schedule = "0 */4 * * *"

# Proxy /api/* to the `api` function. Path must become /api/... AFTER serverless-http strips
# basePath `/.netlify/functions/api`, or Express routes (/api/auth/register, etc.) never match.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
