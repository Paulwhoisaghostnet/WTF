lection{margin:14px 0;padding:0;list-style:none}.selection li{display:flex;justify-content:space-between;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid #314744}.selection button{width:34px;min-height:34px}.empty{color:var(--muted)}.filters{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 20px}.filters label{min-width:170px;flex:1}.tier{margin-bottom:25px}.tier h2{display:flex;align-items:center;gap:10px;margin:0 0 10px;color:var(--gold)}.tier h2 small{font:12px system-ui;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.hero{display:flex;flex-direction:column;min-width:0;min-height:300px;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#213b39,#132729);transition:border-color .15s,transform .15s}.hero:hover{transform:translateY(-2px);border-color:var(--gold)}.hero.chosen{box-shadow:0 0 0 2px var(--gold),0 0 24px #edbb5a77}.hero img{width:100%;height:156px;object-fit:contain;background:radial-gradient(ellipse at 50% 80%,#53675d66,transparent 65%)}.hero-body{display:flex;flex:1;flex-direction:column;gap:3px;padding:10px}.hero h3{margin:0;font:20px Georgia,serif}.hero p{margin:0;color:var(--muted);font-size:12px}.hero .ability{margin:7px 0 10px;color:var(--cream);line-height:1.35}.hero button{margin-top:auto;min-height:36px;border-color:var(--gold);background:#335044;font-weight:700}.hero.chosen button{background:var(--gold);color:#0b171a}.status{min-height:22px;color:var(--gold)}@media(max-width:800px){main{grid-template-columns:1fr;padding:12px}.planner{position:static;max-height:none;padding:12px}.planner summary strong{font-size:20px}.selection{display:flex;flex-wrap:wrap;gap:5px}.selection li{border:1px solid var(--line);border-radius:5px;padding:3px 5px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.hero img{height:125px}}
</style></head><body><header><div><h1>Team Builder</h1><p class="tagline">Choose heroes across the v2 cast. Your active lineup glows in the shop.</p></div><a href="welcome.html">← Home</a></header><main><aside class="planner"><details id="plan-editor" open><summary><strong>Your lineup</strong><span id="plan-summary-name"></span><span id="count"></span></summary><div class="plan-body"><label for="plans">Saved plan<select id="plans"></select></label><div class="plan-controls"><button id="new-plan" type="button">New lineup</button><button id="delete-plan" type="button">Delete lineup</button></div><label for="plan-name">Lineup name<input id="plan-name" maxlength="80" autocomplete="off"></label><ol id="selection" class="selection"></ol><button id="use-plan" class="use-plan" type="button">Use this lineup</button><p class="status" role="status" id="status"></p><p class="empty">Up to 10 unique heroes, matching the level 10 field limit. Plans are saved in this browser and can be changed between matches.</p></div></details></aside><section aria-label="Hero roster"><div class="filters"><label for="faction">Faction<select id="faction"></select></label><label for="class">Class<select id="class"></select></label></div><div id="roster"></div></section></main>

:"Draw nearby attacks, shelter two wounded allies, restore those close to your shell and scorch the target. Ability cost: 3 AP."},"image":"hero-art/ember-korrun.png"},{"id":"ember-vikka","name":"Lil Brisket","title":"Back-Alley Caterer","cost":2,"faction":"ember","classes":["duelist","assassin"],"ability":{"name":"Three Cuts, No Waiting","description":"Ambush a wounded enemy with three quick cuts, gain haste and leave a burning trail down the target column. Ability cost: 3 AP."},"image":"hero-art/ember-vikka.png"},{"id":"ember-aereth","name":"Auntie Flare","title":"Aggressive Hospitality","cost":5,"faction":"ember","classes":["mender","stormcaller"],"ability":{"name":"Have Another Helping","description":"Restore every ally, shelter the most wounded with a radiant shield and rain lingering fire over every enemy. Ability cost: 3 AP."},"image":"hero-art/ember-aereth.png"},{"id":"ember-drazhul","name":"Charbro","title":"Load-Bearing Grill","cost":4,"faction":"ember","classes":["vanguard","arcanist"],"ability":{"name":"Who Touched the Thermostat?","description":"Blast surrounding enemies and the strongest foe, raise an obsidian shield and draw attacks from adjacent enemies. Ability cost: 3 AP."},"image":"hero-art/ember-drazhul.png"},{"id":"ember-sazrik","name":"Sizzle","title":"Venom Sommelier","cost":2,"faction":"ember","classes":["hexbinder"],"ability":{"name":"Notes of Regret","description":"Strike a wounded enemy with burning, slowing venom while restoring the most wounded ally. Ability cost: 3 AP."},"image":"hero-art/ember-sazrik.png"},{"id":"silk-luneth","name":"Lil Spoon","title":"Comfort Specialist","cost":1,"faction":"silk","classes":["mender"],"ability":{"name":"You Look Like You Need This","description":"Heal, shield and hasten a wounded ally inside a lunar cocoon while a silver thread lashes the target. Ability cost: 3 AP."},"image":"hero-art/silk-luneth.png"},{"id":"silk-thimri","name":"Seam Reaper","title":"Pastel Menace","cost":2,"faction":"silk","classes" sorder","hollow":"The Late Fees","iron":"Void Warranty","astral":"Bedtime Is a Lie","dune":"Cul-de-Sac Outlaws","silk":"Cuddle Cartel","rime":"Freezer Burnouts","gargoyle":"Curb Appeal"},"classNames":{"vanguard":"Vanguard","sentinel":"Sentinel","arcanist":"Arcanist","duelist":"Duelist","mender":"Mender","artificer":"Artificer","ranger":"Ranger","assassin":"Assassin","stormcaller":"Stormcaller","hexbinder":"Hexbinder"}};</script><script>(()=>{'use strict';
const KEY='colilseum:lineups:v1',MAX=10;
const $=id=>document.getElementById(id),heroById=new Map(TEAM_DATA.heroes.map(hero=>[hero.id,hero]));
const fresh=()=>({id:crypto.randomUUID(),name:'My lineup',heroIds:[]});
function load(){try{const data=JSON.parse(localStorage.getItem(KEY));if(data&&Array.isArray(data.plans)&&data.plans.length){const plans=data.plans.filter(p=>typeof p.id==='string'&&Array.isArray(p.heroIds)).map(p=>({...p,name:String(p.name||'Lineup'),heroIds:[...new Set(p.heroIds.filter(id=>heroById.has(id)))].slice(0,MAX)}));if(plans.length)return{plans,activeId:plans.some(p=>p.id===data.activeId)?data.activeId:plans[0].id,editingId:plans[0].id};}}catch{}const p=fresh();return{plans:[p],activeId:p.id,editingId:p.id};}
let state=load();const current=()=>state.plans.find(p=>p.id===state.editingId)||state.plans[0];
function save(){try{localStorage.setItem(KEY,JSON.stringify({plans:state.plans,activeId:state.activeId}));$('status').textContent='Saved in this browser.';}catch{$('status').textContent='Browser storage is unavailable; this plan will not persist.';}}
function option(value,label){const node=document.createElement('option');node.value=value;node.textContent=label;return node;}
function setupFilters(){const factions=$('faction'),classes=$('class');factions.append(option('','All factions'),...TEAM_DATA.factions.map(f=>option(f.id,f.name)));classes.append(option('','All classes'),...TEAM_DATA.classes.map(c=>option(c.id,c.name)));factions.onchange=renderRoster;classes.onchange=renderRoster;}
function renderPlan(){const p=current(),plans=$('plans');plans.replaceChildren(...state.plans.map(plan=>option(plan.id,(plan.id===state.activeId?'★ ':'')+plan.name)));plans.value=p.id;$('plan-name').value=p.name;$('count').textContent=`${p.heroIds.length} / ${MAX}`;$('plan-summary-name').textContent=p.name;$('use-plan').setAttribute('aria-pressed',String(state.activeId===p.id));$('use-plan').textContent=state.activeId===p.id?'Active lineup ✓':'Use this lineup';const list=$('selection');list.replaceChildren();for(const id of p.heroIds){const h=heroById.get(id),li=document.createElement('li'),label=document.createElement('span'),remove=document.createElement('button');label.textContent=`${h.name} · ${h.cost}g`;remove.type='button';remove.textContent='×';remove.setAttribute('aria-label',`Remove ${h.name}`);remove.onclick=()=>toggle(id);li.append(label,remove);list.append(li);}}
function toggle(id){const p=current(),at=p.heroIds.indexOf(id);if(at>=0)p.heroIds.splice(at,1);else if(p.heroIds.length<MAX)p.heroIds.push(id);else{$('status').textContent=`A level 10 field holds ${MAX} heroes. Remove one to add another.`;return;}save();renderPlan();renderRoster();}
function renderRoster(){const root=$('roster'),f=$('faction').value,c=$('class').value,p=current();root.replaceChildren();for(let cost=1;cost<=5;cost++){const members=TEAM_DATA.heroes.filter(h=>h.cost===cost&&(!f||h.faction===f)&&(!c||h.classes.includes(c)));if(!members.length)continue;const section=document.createElement('section'),heading=document.createElement('h2'),grid=document.createElement('div');section.className='tier';heading.textContent=`${cost} gold`;const small=document.createElement('small');small.textContent=`${members.length} heroes`;heading.append(small);grid.className='grid';for(const h of members){const card=document.createElement('article'),img=document.createElement('img'),body=document.createElement('div'),title=document.createElement('h3'),traits=document.createElement('p'),ability=document.createElement('p'),button=document.createElement('button');card.className='hero'+(p.heroIds.includes(h.id)?' chosen':'');img.src=h.image;img.alt=h.name+' character art';img.loading='lazy';body.className='hero-body';title.textContent=h.name;traits.textContent=[TEAM_DATA.factionNames[h.faction]||'Independent',...h.classes.map(id=>TEAM_DATA.classNames[id]||id)].join(' · ');ability.className='ability';ability.textContent=h.ability.name+' — '+h.ability.description;button.type='button';button.textContent=p.heroIds.includes(h.id)?'Remove from lineup':'Add to lineup';button.setAttribute('aria-pressed',String(p.heroIds.includes(h.id)));button.onclick=()=>toggle(h.id);body.append(title,traits,ability,button);card.append(img,body);grid.append(card);}section.append(heading,grid);root.append(section);}if(!root.children.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='No heroes match these filters.';root.append(empty);}}
$('plans').onchange=e=>{state.editingId=e.target.value;renderPlan();renderRoster();};$('plan-name').oninput=e=>{current().name=e.target.value;save();const cursor=e.target.selectionStart;renderPlan();$('plan-name').focus();$('plan-name').setSelectionRange(cursor,cursor);};$('new-plan').onclick=()=>{const p=fresh();state.plans.push(p);state.editingId=p.id;save();renderPlan();renderRoster();$('plan-name').focus();$('plan-name').select();};$('delete-plan').onclick=()=>{const deleted=current();state.plans=state.plans.filter(p=>p.id!==deleted.id);if(!state.plans.length)state.plans.push(fresh());if(state.activeId===deleted.id)state.activeId=state.plans[0].id;state.editingId=state.plans[0].id;save();renderPlan();renderRoster();};$('use-plan').onclick=()=>{state.activeId=current().id;save();renderPlan();};if(matchMedia('(max-width:800px)').matches)$('plan-editor').open=false;setupFilters();renderPlan();renderRoster();
})();
</script></body></html>
