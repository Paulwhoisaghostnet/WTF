name: Install Kiln deploy key on Hetzner

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: "Full ssh-ed25519 line"
        required: true
        type: string

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH with WTF deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Append kiln pubkey to authorized_keys
        env:
          PUBKEY: ${{ inputs.public_key }}
          TARGET: ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}
        run: |
          REMOTE_CMD='mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && if grep -qxF "'"$PUBKEY"'" ~/.ssh/authorized_keys; then echo already-present; else echo "'"$PUBKEY"'" >> ~/.ssh/authorized_keys && echo appended; fi && wc -l ~/.ssh/authorized_keys'
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$TARGET" "$REMOTE_CMD"
