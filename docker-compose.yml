services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wtf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wtf
    volumes:
      - ${POSTGRES_DATA_DIR:-/mnt/wtf-data/postgres}:/var/lib/postgresql/data
    # Docker's default `/dev/shm` is only 64 MB, which Postgres exhausts
    # the moment a parallel query plans its dynamic shared memory
    # segments.  That manifested as the gallery 500'ing for users with
    # ~7k+ holdings (the facet queries trigger parallel workers on
    # large LEFT JOINs over token_metadata).  1 GB is plenty for this
    # workload; raise only if SELECT pg_shmem_allocations() ever
    # approaches it.
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtf -d wtf"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        COMMIT_SHA: ${COMMIT_SHA:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${WTF_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://wtf:${POSTGRES_PASSWORD}@postgres:5432/wtf
      NODE_ENV: production
      COMMIT_REF: ${COMMIT_SHA:-dev}
      WTF_DATA_ROOT: /mnt/wtf-data
      UPLOAD_STAGING_DIR: /app/uploads-staging
      MEDIA_HOT_CACHE_DIR: /app/cache/users
      TMP_PROCESSING_DIR: /app/tmp-processing
      BACKUPS_STAGING_DIR: /app/backups
      TV_CACHE_DIR: /app/cache/tv
      BUMPER_UPLOADS_DIR: /app/cache/bumpers
      MEDIA_UPLOAD_MAX_BYTES: ${MEDIA_UPLOAD_MAX_BYTES:-26214400}
      MEDIA_HOT_CACHE_MAX_BYTES: ${MEDIA_HOT_CACHE_MAX_BYTES:-32212254720}
      VOLUME_RESERVED_FREE_BYTES: ${VOLUME_RESERVED_FREE_BYTES:-16106127360}
      OBJECT_STORAGE_LIMIT_BYTES: ${OBJECT_STORAGE_LIMIT_BYTES:-1040450734080}
      OBJECT_STORAGE_WARN_80_BYTES: ${OBJECT_STORAGE_WARN_80_BYTES:-832360587264}
      OBJECT_STORAGE_WARN_90_BYTES: ${OBJECT_STORAGE_WARN_90_BYTES:-936405660672}
      OBJECT_STORAGE_PROTECT_95_BYTES: ${OBJECT_STORAGE_PROTECT_95_BYTES:-988428527616}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      RCLONE_CONFIG: ${RCLONE_CONFIG:-/etc/wtf/secrets/rclone.conf}
      GDRIVE_REMOTE: ${GDRIVE_REMOTE:-}
    volumes:
      - ${UPLOAD_STAGING_DIR_HOST:-/mnt/wtf-data/uploads-staging}:/app/uploads-staging
      - ${TV_CACHE_DIR_HOST:-/mnt/wtf-data/tv-cache}:/app/cache
      - ${TMP_PROCESSING_DIR_HOST:-/mnt/wtf-data/tmp-processing}:/app/tmp-processing
      - ${BACKUPS_STAGING_DIR_HOST:-/mnt/wtf-data/backups-staging}:/app/backups
      - ${APP_LOG_DIR_HOST:-/var/log/wtf/app}:/app/logs
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Allow Caddy to reach native host services (e.g. kiln.service on :3001)
    # via `host.docker.internal`. Linux does not populate this by default; the
    # `host-gateway` alias was added in Docker 20.10+.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 1.1.1.1
      - 8.8.8.8

volumes:
  caddy_data:
  caddy_config:
