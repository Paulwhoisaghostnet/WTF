name: Verify Gallery Fix

# Smoke-test the two SQL patterns we just changed (facet subqueries +
# minted sort NULLS LAST) against the production Postgres.  Read-only.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Verify fixed facet query (creators)
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'cd /opt/platform/repos/wtf-app && docker compose exec -T postgres psql -U wtf -d wtf -v ON_ERROR_STOP=1' <<'SQL'
          \timing on
          \pset pager off
          \set uid 3

          -- creators facet, rewritten to subquery form
          SELECT name, count(*)::int AS count
          FROM (
            SELECT COALESCE(
                NULLIF((COALESCE(tm.raw, '{}'::jsonb)) ->> 'creator', ''),
                CASE
                  WHEN jsonb_typeof((COALESCE(tm.raw, '{}'::jsonb)) -> 'creators') = 'array'
                       AND jsonb_array_length((COALESCE(tm.raw, '{}'::jsonb)) -> 'creators') > 0
                  THEN (COALESCE(tm.raw, '{}'::jsonb)) -> 'creators' ->> 0
                  ELSE NULL
                END
              ) AS name
              FROM wallet_holdings h
              LEFT JOIN token_metadata tm ON tm.token_contract = h.token_contract AND tm.token_id = h.token_id
             WHERE h.user_id = :uid
          ) s
          WHERE name IS NOT NULL
          GROUP BY name
          ORDER BY count DESC, name ASC
          LIMIT 10;

          -- minted_desc sort, with regex guard around the timestamp cast
          -- so malformed date strings (e.g. 'GMT+0300' suffixes) don't
          -- error the whole query.
          SELECT h.id, h.token_contract, h.token_id,
                 (COALESCE(tm.raw, '{}'::jsonb) ->> 'date') AS minted
            FROM wallet_holdings h
            LEFT JOIN token_metadata tm ON tm.token_contract = h.token_contract AND tm.token_id = h.token_id
           WHERE h.user_id = :uid
           ORDER BY
             CASE
               WHEN (COALESCE(tm.raw, '{}'::jsonb) ->> 'date') ~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
                 THEN (COALESCE(tm.raw, '{}'::jsonb) ->> 'date')::timestamp
               ELSE NULL
             END DESC NULLS LAST,
             COALESCE(h.tzkt_last_time, h.last_activity_at, h.derived_at) DESC
           LIMIT 10;

          -- Count how many rows have a malformed 'date' — useful context.
          SELECT count(*) FILTER (WHERE (COALESCE(tm.raw, '{}'::jsonb) ->> 'date') IS NOT NULL
                                    AND (COALESCE(tm.raw, '{}'::jsonb) ->> 'date') !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}')::int
                 AS malformed_date_rows
            FROM wallet_holdings h
            LEFT JOIN token_metadata tm ON tm.token_contract = h.token_contract AND tm.token_id = h.token_id
           WHERE h.user_id = :uid;
          SQL
